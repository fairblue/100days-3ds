<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ポチャつり 〜うきのタイミング〜 | 100日チャレンジ Day 1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b2e3d; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; min-height:100dvh; padding:10px; }
  #wrap { width:min(96vw, 480px, calc((100dvh - 110px) * 0.75)); margin:auto; }
  canvas { width:100%; height:auto; display:block; border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.45); touch-action:manipulation; cursor:pointer; background:#2e8fa8; }
  #hint { color:#cfeef5; text-align:center; font-size:13px; margin-top:10px; line-height:1.7; opacity:.9; }
  #hint b { color:#ffe27a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">タップ / クリック / スペースキー： ウキを投げる → <b>ウキが沈んだ瞬間</b>にもう一度押して釣り上げよう。<br>つつかれている時に押すと逃げられます。</div>
</div>
<script>
"use strict";
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 480, H = 640;
const DEMO = new URLSearchParams(location.search).has('demo');

/* ---------------- util ---------------- */
const rand = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));

/* ---------------- audio (WebAudio, all synthesized) ---------------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function blip(freq, dur, type, vol, slideTo){
  if(!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol||0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
}
function noiseBurst(dur, vol, freq){
  if(!AC) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq||900;
  const g = AC.createGain(); g.gain.value = vol||0.25;
  src.connect(f).connect(g).connect(AC.destination); src.start(t);
}
const sndPlop  = ()=>{ blip(420,0.14,'sine',0.15,140); noiseBurst(0.08,0.10,700); };
const sndNibble= ()=>{ blip(660,0.07,'sine',0.07,520); };
const sndBite  = ()=>{ noiseBurst(0.22,0.32,1000); blip(300,0.2,'sine',0.18,90); };
const sndCatch = ()=>{ [523,659,784,1046].forEach((f,i)=> setTimeout(()=>blip(f,0.16,'triangle',0.14), i*80)); };
const sndMiss  = ()=>{ blip(220,0.3,'sine',0.12,110); };

/* ---------------- fish data (all original) ---------------- */
const FISH = [
  { name:'ポチャウオ',   size:[10,26],  pts:10,  weight:34, color:'#7fd4a8', window:340 },
  { name:'ヒラヒラウオ', size:[18,34],  pts:20,  weight:27, color:'#ffd97a', window:320 },
  { name:'トゲトゲウオ', size:[15,30],  pts:30,  weight:20, color:'#ff9d7a', window:300 },
  { name:'ホシウオ',     size:[22,42],  pts:50,  weight:13, color:'#a8c8ff', window:280 },
  { name:'ニジウオ',     size:[30,58],  pts:100, weight:6,  color:'#f2a8ff', window:250 },
];
function pickFish(){
  let tot = FISH.reduce((s,f)=>s+f.weight,0), r = Math.random()*tot;
  for(const f of FISH){ if((r-=f.weight) <= 0) return f; }
  return FISH[0];
}

/* ---------------- game state ---------------- */
let state = 'ready';        // ready | wait | bite | caught | escaped
let stateT = 0;             // time in current state (ms)
let score = 0, catches = 0, combo = 0, bestCombo = 0;
let message = 'タップでウキを投げよう！';
let subMessage = '';
const bobber = { x: W/2, y: 300, dip: 0, baseY: 300 };
let fish = null;            // {def, x,y, ang, phase, phaseT, nibblesLeft, nextNibble, sizeCm}
let particles = [];
let ripples = [];
let caughtFish = null;      // {def, sizeCm, t}
let sparkles = Array.from({length:26},()=>({ x:rand(10,W-10), y:rand(120,H-20), r:rand(1,2.6), p:rand(0,Math.PI*2), s:rand(0.2,0.7) }));
let lilies = [ {x:56,y:470,r:26,a:0.4}, {x:420,y:520,r:32,a:2.2}, {x:70,y:170,r:20,a:1.1}, {x:428,y:150,r:22,a:5.0} ];
let demoTimer = 0, demoBites = 0, castAt = 0;

function spawnFish(){
  const def = pickFish();
  const side = Math.random()<0.5 ? -30 : W+30;
  fish = {
    def, sizeCm: Math.round(rand(def.size[0], def.size[1])*10)/10,
    x: side, y: rand(380, 560),
    ang: side<0 ? 0 : Math.PI,
    phase:'approach', phaseT:0,
    nibblesLeft: 1 + Math.floor(Math.random()*4),   // 1..4 nibbles before bite
    nextNibble: rand(500, 1100),
    shadowScale: clamp((def.size[0]+def.size[1])/60, 0.7, 1.5),
  };
}
function cast(){
  audio();
  bobber.x = rand(W/2-70, W/2+70); bobber.baseY = rand(280, 340); bobber.y = bobber.baseY; bobber.dip = 0;
  spawnFish();
  state = 'wait'; stateT = 0; castAt = performance.now();
  message = '魚影が近づいてくる…'; subMessage = '';
  ripples.push({x:bobber.x, y:bobber.y, r:4, a:0.8});
  sndPlop();
}
function startBite(){
  state = 'bite'; stateT = 0;
  bobber.dip = 14;
  for(let i=0;i<14;i++) particles.push({ x:bobber.x+rand(-8,8), y:bobber.y, vx:rand(-90,90), vy:rand(-190,-60), g:520, life:rand(0.35,0.6), t:0, r:rand(1.5,3.2) });
  ripples.push({x:bobber.x, y:bobber.y, r:6, a:0.95});
  message = 'かかった！！'; subMessage = '';
  sndBite();
  if(DEMO) demoBites++;
}
function doCatch(){
  state = 'caught'; stateT = 0;
  caughtFish = { def: fish.def, sizeCm: fish.sizeCm, t:0, x: bobber.x, y: bobber.y };
  score += fish.def.pts; catches++; combo++; bestCombo = Math.max(bestCombo, combo);
  message = fish.def.name + ' を釣った！'; 
  subMessage = fish.sizeCm.toFixed(1) + ' cm ／ +' + fish.def.pts + '点' + (combo>=2 ? ' ／ ' + combo + '連続！' : '');
  for(let i=0;i<20;i++) particles.push({ x:bobber.x+rand(-10,10), y:bobber.y, vx:rand(-130,130), vy:rand(-260,-90), g:560, life:rand(0.4,0.75), t:0, r:rand(1.5,3.6) });
  sndCatch();
  fish = null; bobber.dip = 0;
}
function doEscape(reason){
  state = 'escaped'; stateT = 0; combo = 0;
  message = reason; subMessage = '……逃げられた';
  if(fish){
    fish.phase = 'flee';
    // flee toward the nearest bottom corner, head-first
    const tx = fish.x < W/2 ? -60 : W+60, ty = H + 60;
    fish.ang = Math.atan2(ty - fish.y, tx - fish.x);
  }
  bobber.dip = 0;
  sndMiss();
}
function press(){
  audio();
  if(state==='ready'){ cast(); }
  else if(state==='wait'){
    if(performance.now() - castAt < 220) return; // ignore accidental double-tap right after casting
    doEscape(fish && fish.phase==='approach' ? '早すぎた！ 魚が来るまで待とう' : '早すぎた！ つつかれ中は我慢');
  }
  else if(state==='bite'){ doCatch(); }
  else if(state==='caught' || state==='escaped'){ if(stateT>500){ state='ready'; fish=null; caughtFish=null; message='タップでウキを投げよう！'; subMessage=''; } }
}
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); if(e.repeat) return; press(); } });
document.addEventListener('pointerdown', e=>{ if(e.button!==undefined && e.button!==0) return; e.preventDefault(); press(); });
document.addEventListener('pointerup', ()=>{ audio(); });

/* ---------------- update ---------------- */
let last = performance.now();
function update(now){
  const dt = Math.min(50, now-last); last = now;
  const dts = dt/1000;
  stateT += dt;

  // ambient sparkles drift
  for(const s of sparkles){ s.p += dts*s.s; s.x += Math.sin(s.p)*0.12; }

  // ripples & particles
  for(const r of ripples){ r.r += dts*46; r.a -= dts*0.9; }
  ripples = ripples.filter(r=>r.a>0);
  for(const p of particles){ p.t += dts; p.x += p.vx*dts; p.y += p.vy*dts; p.vy += p.g*dts; }
  particles = particles.filter(p=>p.t<p.life);

  if(state==='wait' && fish){
    fish.phaseT += dt;
    if(fish.phase==='approach'){
      const tx = bobber.x + 46, ty = bobber.y + 58;
      const dx = tx-fish.x, dy = ty-fish.y, dist = Math.hypot(dx,dy);
      const sp = 150*dts;
      if(dist < 8){ fish.phase='tease'; fish.phaseT=0; }
      else { fish.x += dx/dist*sp; fish.y += dy/dist*sp; fish.ang = Math.atan2(dy,dx); }
    } else if(fish.phase==='tease'){
      // circle slowly around bobber
      const cx = bobber.x, cy = bobber.y + 52;
      const a = Math.atan2(fish.y-cy, fish.x-cx) + dts*0.7;
      const rr = 44 + Math.sin(fish.phaseT/300)*5;
      fish.x = cx + Math.cos(a)*rr; fish.y = cy + Math.sin(a)*rr*0.62;
      fish.ang = a + Math.PI/2;
      fish.nextNibble -= dt;
      bobber.dip = Math.max(0, bobber.dip - dt*0.05);
      if(fish.nextNibble<=0){
        if(fish.nibblesLeft>0){
          fish.nibblesLeft--;
          bobber.dip = 5;
          ripples.push({x:bobber.x, y:bobber.y, r:3, a:0.6});
          sndNibble();
          fish.nextNibble = rand(600, 1500);
        } else {
          startBite();
        }
      }
    }
  }
  if(state==='bite'){
    if(stateT > (fish? fish.def.window : 300)){
      doEscape('遅かった！ ウキが沈んだ瞬間に');
    }
  }
  if(state==='caught' && caughtFish){ caughtFish.t += dts; }
  if(state==='escaped' && fish && fish.phase==='flee'){
    fish.x += Math.cos(fish.ang)*280*dts; fish.y += Math.sin(fish.ang)*280*dts;
    if(fish.x<-60 || fish.x>W+60 || fish.y>H+60) fish=null;
  }

  if(DEMO){
    demoTimer += dt;
    if(state==='ready' && demoTimer>700){ press(); demoTimer=0; }
    if(state==='bite' && stateT>110 && demoBites%3!==0){ press(); } // every 3rd bite: demo lets it escape
    if((state==='caught'||state==='escaped') && stateT>1400){ press(); }
  }
  draw(now/1000);
  requestAnimationFrame(update);
}

/* ---------------- draw ---------------- */
function draw(t){
  // water
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3fa9c4'); g.addColorStop(0.55,'#2e8fa8'); g.addColorStop(1,'#1f6f8c');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // light rays
  ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = '#ffffff';
  for(let i=0;i<3;i++){ const x = ((t*14 + i*170) % (W+220)) - 110; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+52,0); ctx.lineTo(x+130,H); ctx.lineTo(x+40,H); ctx.fill(); }
  ctx.restore();
  // sparkles
  ctx.save(); ctx.fillStyle = '#dff7ff';
  for(const s of sparkles){ ctx.globalAlpha = 0.25 + 0.25*Math.sin(s.p*2); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
  // lily pads
  for(const L of lilies){
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.a + Math.sin(t*0.5+L.x)*0.05);
    ctx.fillStyle = 'rgba(46,139,87,0.85)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,L.r, 0.35, Math.PI*2-0.35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.beginPath(); ctx.arc(-L.r*0.3,-L.r*0.25, L.r*0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // header panel
  ctx.fillStyle = 'rgba(6,42,56,0.55)'; roundRect(12,12,W-24,64,14); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 21px sans-serif'; ctx.textAlign='left';
  ctx.fillText('ポチャつり', 26, 40);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#bfe8f2';
  ctx.fillText('〜 うきのタイミング 〜', 26, 62);
  ctx.textAlign='right'; ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText(score + '点', W-26, 40);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#bfe8f2';
  ctx.fillText('釣果 ' + catches + '匹' + (bestCombo>=2 ? ' ／ 最大'+bestCombo+'連続' : ''), W-26, 62);
  ctx.textAlign='left';

  // fish shadow
  if(fish && state!=='caught'){
    ctx.save(); ctx.translate(fish.x, fish.y); ctx.rotate(fish.ang);
    const sc = fish.shadowScale;
    ctx.fillStyle = 'rgba(8,46,54,0.42)';
    ctx.beginPath(); ctx.ellipse(0,0, 30*sc, 12*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-28*sc,0); ctx.lineTo(-44*sc,-10*sc); ctx.lineTo(-44*sc,10*sc); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // fishing line + bobber (not in caught result jump)
  if(state!=='caught'){
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(W-6, 84); ctx.quadraticCurveTo(bobber.x+70, bobber.y-120, bobber.x, bobber.y - 4 + bobber.dip); ctx.stroke();
    // ripples around bobber
    for(const r of ripples){ ctx.save(); ctx.globalAlpha = Math.max(0,r.a); ctx.strokeStyle='#eafcff'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r*0.36, 0, 0, Math.PI*2); ctx.stroke(); ctx.restore(); }
    const by = bobber.baseY + bobber.dip + Math.sin(t*2.2)*2.2;
    if(state!=='ready'){ bobber.y = by; }
    // bobber: red top / white bottom
    ctx.save(); ctx.translate(bobber.x, state==='ready'? bobber.baseY : by);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI); ctx.fill();
    ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(0,0,9,Math.PI,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#37474f'; ctx.fillRect(-1.4,-16,2.8,7);
    ctx.restore();
  }

  // splash particles
  ctx.fillStyle = '#eafcff';
  for(const p of particles){ ctx.globalAlpha = 1 - p.t/p.life; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;

  // caught fish jump
  if(state==='caught' && caughtFish){
    const ft = caughtFish.t;
    const jx = caughtFish.x, jy = caughtFish.y - Math.sin(Math.min(1,ft/0.55)*Math.PI)*120 - 10;
    const rot = -0.5 + Math.min(1,ft/0.55)*1.0;
    ctx.save(); ctx.translate(jx, jy); ctx.rotate(rot);
    ctx.fillStyle = caughtFish.def.color;
    ctx.beginPath(); ctx.ellipse(0,0,34,15,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-32,0); ctx.lineTo(-50,-13); ctx.lineTo(-50,13); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(20,-3,5.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#12333f'; ctx.beginPath(); ctx.arc(21.4,-3,2.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(2,4,16,5.4,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // result panel
    if(ft>0.45){
      ctx.fillStyle = 'rgba(6,42,56,0.78)'; roundRect(W/2-150, 420, 300, 86, 16); ctx.fill();
      ctx.textAlign='center'; ctx.fillStyle = '#ffe27a'; ctx.font='bold 24px sans-serif';
      ctx.fillText(caughtFish.def.name, W/2, 456);
      ctx.fillStyle = '#ffffff'; ctx.font='16px sans-serif';
      ctx.fillText(caughtFish.sizeCm.toFixed(1)+' cm　／　+'+caughtFish.def.pts+'点', W/2, 484);
      ctx.textAlign='left';
    }
  }

  // message bar
  ctx.fillStyle = 'rgba(6,42,56,0.55)'; roundRect(12, H-76, W-24, 64, 14); ctx.fill();
  ctx.textAlign='center';
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 19px sans-serif';
  ctx.fillText(message, W/2, H-46);
  ctx.fillStyle = '#bfe8f2'; ctx.font = '13px sans-serif';
  ctx.fillText(subMessage || (state==='wait' ? 'つつかれても我慢…沈んだ瞬間に押す！' : ''), W/2, H-22);
  ctx.textAlign='left';

  // big "!" cue at bite
  if(state==='bite'){
    ctx.save(); ctx.translate(bobber.x+26, bobber.baseY-52);
    ctx.scale(1+Math.sin(t*30)*0.08, 1+Math.sin(t*30)*0.08);
    ctx.fillStyle = '#ff5252'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign='center';
    ctx.fillText('！', 0, 0); ctx.restore(); ctx.textAlign='left';
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
requestAnimationFrame(update);
</script>
</body>
</html>
