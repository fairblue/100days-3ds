<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヒキダシタワー 〜ブロックを引いてのぼれ〜</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1B2340; --wood: #C98A4B; --wood-d: #8A5A2E; --cream: #F4E3C1;
    --teal: #3EE6C4; --gold: #FFD166; --coral: #FF8A5C; --text: #F4F1FF;
    --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 8px 0;
  }
  .stage {
    position: relative;
    width: min(96vw, 480px, calc(max(0px, 100dvh - 110px) * 0.75));
    aspect-ratio: 3 / 4;
    container-type: size;
  }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 2cqw;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas:focus-visible, .overlay-btn:focus-visible { outline: 0.8cqw solid var(--gold); outline-offset: 0.6cqw; }
  .overlay-btn {
    position: absolute; font-family: var(--font); font-size: 4cqw; font-weight: 700;
    white-space: nowrap; cursor: pointer; border: 0; color: #12301F;
    background: var(--teal); border-radius: 99cqw; padding: 1.8cqw 7cqw;
  }
  .overlay-btn[hidden] { display: none; }
  .main-btn { left: 50%; transform: translateX(-50%); bottom: 6%; font-size: 4.6cqw; }
  .reset-btn {
    top: 2cqw; right: 2.5cqw; font-size: 3.2cqw; padding: 1cqw 3cqw; border-radius: 2.5cqw;
    background: rgba(244, 241, 255, .14); color: var(--text); border: 0.3cqw solid rgba(244, 241, 255, .45);
  }
  .reset-btn.emph { background: var(--teal); color: #12301F; border-color: var(--gold); box-shadow: 0 0 0 0.7cqw rgba(62, 230, 196, .35); }
  .hint { margin: 0; font-size: clamp(11px, 2.6vw, 13px); color: rgba(244, 241, 255, .7); text-align: center; line-height: 1.4; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="cv" width="480" height="640" tabindex="0" aria-label="ヒキダシタワーのゲーム画面。光るブロックを引いて足場を作り、ポコを星まで登らせます。"></canvas>
  <button class="overlay-btn reset-btn" id="reset" type="button" hidden>リセット</button>
  <button class="overlay-btn main-btn" id="start" type="button">スタート</button>
  <button class="overlay-btn main-btn" id="again" type="button" hidden>もう一度</button>
</main>
<p class="hint">スペース / Enter：スタート・もう一度　R：リセット　1〜5：ブロックを引く ／ 移動はタップで</p>
<div class="sr" id="sr" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- 定数 ---------- */
const W = 480, H = 640;
const CELL = 56, TX = 100, TY = 280, GY = 560;          // 塔の左上と地面の高さ
const T = { bg:'#1B2340', wood:'#C98A4B', dark:'#8A5A2E', cream:'#F4E3C1', teal:'#3EE6C4',
            gold:'#FFD166', coral:'#FF8A5C', text:'#F4F1FF', pit:'#10162F' };
const FONT = '"Hiragino Maru Gothic ProN","BIZ UDPGothic","Arial Rounded MT Bold",system-ui,sans-serif';
const STAR = { r: 1, c: 3 };
// 引けるブロック（行, 列）。数字キー1〜5はこの順（左上から読む順）
const PULLABLE = [ {r:2,c:3}, {r:3,c:1}, {r:3,c:2}, {r:4,c:1}, {r:4,c:4} ];
const MAX_PULLS = 3;
const MSG_STUCK = '引き数が足りないよ。リセットして挑戦し直そう';
const MSG_NOMORE = 'これ以上引けないよ。星を目指そう！';
const MSG_REACH = 'そこへは届かないよ。ジャンプは上へ1段・横へ1列まで';

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const btnStart = $('start'), btnAgain = $('again'), btnReset = $('reset'), sr = $('sr');
const mq = matchMedia('(prefers-reduced-motion: reduce)');
const dur = s => (mq.matches ? 0 : s);
const DEMO = new URLSearchParams(location.search).has('demo');
const cx = c => TX + c * CELL, cy = r => TY + r * CELL;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 状態 ---------- */
let state = 'title';                 // 'title' | 'play' | 'clear'
let clock = 0, gameT = 0, evT = null;
let blocks, pulls, pullsUsed, moves, timeSec, rank, poco, vis, dir, stuck;
let toastText = '', toastUntil = 0, hardFx = {}, clearAt = 0, demoQ = [];
let S = 1;                           // canvas 内部ピクセル / 論理座標

function resetBoard() {
  blocks = PULLABLE.map(p => ({ r: p.r, c0: p.c, pulled: false, t0: -9 }));
  pulls = MAX_PULLS; pullsUsed = 0; moves = 0; gameT = 0; timeSec = 0; rank = null;
  poco = { r: 5, c: 0 }; dir = 1; stuck = false; toastText = ''; hardFx = {}; clearAt = 0;
  const p = pxy(poco);
  vis = { fx: p.x, fy: p.y, tx: p.x, ty: p.y, t0: -9, d: 0 };
}
function pxy(pos) {                  // ポコの足元の座標
  if (pos.r === STAR.r && pos.c === STAR.c) return { x: cx(pos.c) + 28, y: cy(pos.r) + 44 };
  return { x: cx(pos.c) + 28, y: pos.r === 5 ? GY : cy(pos.r) };
}
function pocoXY() {
  if (vis.d <= 0) return { x: vis.tx, y: vis.ty };
  const p = (clock - vis.t0) / vis.d;
  if (p >= 1) return { x: vis.tx, y: vis.ty };
  const q = Math.max(0, p);
  return { x: vis.fx + (vis.tx - vis.fx) * q, y: vis.fy + (vis.ty - vis.fy) * q - 104 * q * (1 - q) };
}
function say(t) { sr.textContent = ''; setTimeout(() => { sr.textContent = t; }, 30); }
function toast(t, d = 2.4) { toastText = t; toastUntil = clock + d; say(t); }

/* ---------- ルール ---------- */
function canReach(a, b) {
  return !(a.r === b.r && a.c === b.c) && (a.r - b.r <= 1) && Math.abs(a.c - b.c) <= 1;
}
function platforms() {
  const l = [];
  for (let c = 0; c < 5; c++) l.push({ r: 5, c });
  blocks.forEach(b => { if (b.pulled) l.push({ r: b.r, c: b.c0 - 1 }); });
  l.push(STAR);
  return l;
}
function starPathExists() {
  const pl = platforms(), seen = new Set([poco.r * 10 + poco.c]), q = [poco];
  while (q.length) {
    const a = q.shift();
    if (a.r === STAR.r && a.c === STAR.c) return true;
    for (const b of pl) {
      const k = b.r * 10 + b.c;
      if (!seen.has(k) && canReach(a, b)) { seen.add(k); q.push(b); }
    }
  }
  return false;
}
function checkStuck() {
  if (state === 'play' && pulls <= 0 && !starPathExists()) {
    if (!stuck) { stuck = true; say(MSG_STUCK); }
  }
}
function movePoco(to) {
  const cur = pocoXY(), t = pxy(to);
  vis = { fx: cur.x, fy: cur.y, tx: t.x, ty: t.y, t0: clock, d: dur(0.3) };
  if (t.x !== cur.x) dir = t.x > cur.x ? 1 : -1;
  poco = { r: to.r, c: to.c };
  moves++;
  sfxJump();
}
function pullBlock(b) {
  if (b.pulled) return;
  if (pulls <= 0) { toast(starPathExists() ? MSG_NOMORE : MSG_STUCK); return; }
  pulls--; pullsUsed++;
  b.pulled = true; b.t0 = clock;
  sfxPull();
  const to = { r: b.r, c: b.c0 - 1 };
  if (canReach(poco, to)) movePoco(to);
  checkStuck();
}
function win() {
  state = 'clear';
  timeSec = evT != null ? evT : gameT;
  rank = (timeSec <= 40 && moves <= 6) ? 'S' : (timeSec <= 60 ? 'A' : 'B');
  clearAt = clock + dur(0.5);
  stuck = false; toastText = '';
  sfxClear();
  say('クリア！ タイム' + timeSec.toFixed(1) + '秒、ランク' + rank);
}
function tryMove(to) {
  if (poco.r === to.r && poco.c === to.c) return;
  if (canReach(poco, to)) {
    movePoco(to);
    if (to.r === STAR.r && to.c === STAR.c) win(); else checkStuck();
  } else toast(MSG_REACH);
}
// クリック/タップ/デモ/キーのすべてがここを通る
function onCell(r, c) {
  if (state !== 'play') return;
  const sc = blocks.find(b => b.pulled && b.r === r && b.c0 - 1 === c);
  if (sc) return tryMove({ r, c });
  if (r === STAR.r && c === STAR.c) return tryMove(STAR);
  if (r === 5) return tryMove({ r: 5, c });
  const b = blocks.find(b => !b.pulled && b.r === r && b.c0 === c);
  if (b) return pullBlock(b);
  if (blocks.some(b => b.pulled && b.r === r && b.c0 === c)) return;   // 引いた後の空きマス
  hardFx[r + ',' + c] = clock; sfxClick();
}
function hit(x, y) {
  if (y >= GY) return { r: 5, c: clamp(Math.floor((x - TX) / CELL), 0, 4) };
  if (x < TX || x >= TX + 5 * CELL || y < TY) return null;
  return { r: Math.floor((y - TY) / CELL), c: Math.floor((x - TX) / CELL) };
}

/* ---------- 進行 ---------- */
function startGame() {
  if (state === 'play') return;
  resetBoard(); state = 'play';
  if (!DEMO) cv.focus({ preventScroll: true });
  toast('光るブロックをタップして、横に引き出そう', 3);
}
function resetGame() {
  if (state === 'title') return;
  demoQ = [];
  resetBoard(); state = 'play';
  say('リセットしました');
  cv.focus({ preventScroll: true });
}
function buildDemoTaps() {           // 予定時刻（ゲーム内時刻）のリスト
  return [ { t: 0.8, r: 4, c: 1 }, { t: 2.2, r: 3, c: 2 }, { t: 3.6, r: 2, c: 3 }, { t: 5.0, r: STAR.r, c: STAR.c } ];
}
function runDemo() {
  while (demoQ.length && demoQ[0].t <= gameT && state === 'play') {
    const a = demoQ.shift();
    evT = a.t; onCell(a.r, a.c); evT = null;
  }
}

/* ---------- 音（WebAudio 合成のみ） ---------- */
let actx = null, master = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.3), actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
function tone(type, f0, f1, t, d, v) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function sfx(fn) { if (!actx || actx.state !== 'running') return; try { fn(actx.currentTime + 0.01); } catch (e) {} }
function sfxPull() {
  sfx(t => {
    const n = actx.createBufferSource(); n.buffer = noiseBuf;
    const f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.22);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + 0.28);
    tone('sine', 180, 90, t + 0.18, 0.12, 0.5);
  });
}
function sfxJump() { sfx(t => tone('sine', 300, 700, t, 0.15, 0.28)); }
function sfxClick() { sfx(t => tone('square', 220, 220, t, 0.05, 0.12)); }
function fanfare(t) { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, t + i * 0.08, 0.35, 0.22)); }
function sfxClear() {
  sfx(t => {
    fanfare(t);
    [1568, 2093, 2637, 3136].forEach((f, i) => tone('sine', f, f, t + 0.42 + i * 0.07, 0.18, 0.1));
  });
}

/* ---------- 描画ヘルパー ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function starPath(x, y, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function text(s, x, y, size, color, align = 'left', weight = 700) {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function fitSize(s, maxW, size, weight = 700) {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  while (size > 9 && ctx.measureText(s).width > maxW) { size--; ctx.font = weight + ' ' + size + 'px ' + FONT; }
  return size;
}

/* ---------- 描画: 塔まわり ---------- */
function drawHard(x, y) {
  rr(x + 1, y + 1, CELL - 2, CELL - 2, 4); ctx.fillStyle = T.wood; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = T.dark; ctx.stroke();
  ctx.strokeStyle = 'rgba(138,90,46,.55)'; ctx.lineWidth = 1.5;
  [[14, 6, 50], [28, 10, 46], [42, 6, 48]].forEach(([dy, a, b]) => {
    ctx.beginPath(); ctx.moveTo(x + a, y + dy); ctx.lineTo(x + b, y + dy); ctx.stroke();
  });
}
function drawDrawer(x, y, glow) {
  if (glow) { ctx.shadowColor = T.teal; ctx.shadowBlur = 16; }
  rr(x + 3, y + 3, CELL - 6, CELL - 6, 6); ctx.fillStyle = T.cream; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2.5; ctx.strokeStyle = T.dark; ctx.stroke();
  rr(x + 8, y + 8, CELL - 16, CELL - 16, 3); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(138,90,46,.35)'; ctx.stroke();
  ctx.fillStyle = T.dark; ctx.beginPath(); ctx.arc(x + 28, y + 37, 7, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(x + 28, y + 37, 3.5, Math.PI, 0); ctx.closePath(); ctx.fill();
}
function drawPit(x, y) {
  rr(x + 2, y + 2, CELL - 4, CELL - 4, 3); ctx.fillStyle = '#0B1024'; ctx.fill();
}
function drawScaffold(b) {
  const p = dur(0.25) === 0 ? 1 : clamp((clock - b.t0) / 0.25, 0, 1);
  const e = 1 - Math.pow(1 - p, 3);
  const x = cx(b.c0) - CELL * e, y = cy(b.r);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x + 4, y + CELL - 2, CELL - 8, 8);
  drawDrawer(x, y, false);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x + 4, y + 4, CELL - 8, 5);
  ctx.strokeStyle = T.teal; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 5, y + 1.5); ctx.lineTo(x + CELL - 5, y + 1.5); ctx.stroke();
  ctx.lineCap = 'butt';
}
function drawStar(x, y, R) {
  const g = ctx.createRadialGradient(x, y, 2, x, y, R * 2.6);
  g.addColorStop(0, 'rgba(255,209,102,.55)'); g.addColorStop(1, 'rgba(255,209,102,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 2.6, 0, Math.PI * 2); ctx.fill();
  starPath(x, y, R, R * 0.42); ctx.fillStyle = T.gold; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#FFF0C2'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineJoin = 'miter';
  ctx.strokeStyle = '#FFF6DA'; ctx.lineWidth = 1.5;
  [[-R * 1.5, -R * 0.6], [R * 1.45, -R * 0.9], [R * 1.2, R * 0.9]].forEach(([dx, dy]) => {
    ctx.beginPath(); ctx.moveTo(x + dx - 4, y + dy); ctx.lineTo(x + dx + 4, y + dy);
    ctx.moveTo(x + dx, y + dy - 4); ctx.lineTo(x + dx, y + dy + 4); ctx.stroke();
  });
}
function drawPoco(x, y, d) {
  ctx.fillStyle = '#E86F44';
  ctx.beginPath(); ctx.ellipse(x - 7, y - 1.5, 6, 3.2, 0, 0, Math.PI * 2); ctx.ellipse(x + 7, y - 1.5, 6, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = T.coral; ctx.beginPath(); ctx.arc(x, y - 17, 17, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = T.cream; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y - 34, 6, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = T.dark; ctx.fillRect(x - 8, y - 35, 16, 3);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(x - 6, y - 25, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFB59A';
  ctx.beginPath(); ctx.ellipse(x - 11 + d, y - 12, 3.2, 2.2, 0, 0, Math.PI * 2); ctx.ellipse(x + 11 + d, y - 12, 3.2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2A1B2E';
  ctx.beginPath(); ctx.arc(x - 5.5 + d * 1.5, y - 19, 3, 0, Math.PI * 2); ctx.arc(x + 5.5 + d * 1.5, y - 19, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - 4.5 + d * 1.5, y - 20, 1, 0, Math.PI * 2); ctx.arc(x + 6.5 + d * 1.5, y - 20, 1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2A1B2E'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x + d * 1.5, y - 13, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}
function drawGround(y) {
  ctx.fillStyle = '#0F1530'; ctx.fillRect(0, y, W, H - y + 2);
  ctx.strokeStyle = '#4FD1A0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, y + 1.5); ctx.lineTo(W, y + 1.5); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 6; x < W; x += 15) { const h = 5 + ((x * 7) % 5); ctx.moveTo(x, y); ctx.lineTo(x + 2, y - h); }
  ctx.stroke();
}
function drawScene(ground) {
  // 枠と内側
  rr(TX - 5, TY - 5, 5 * CELL + 10, 5 * CELL + 5, 6); ctx.fillStyle = T.dark; ctx.fill();
  ctx.fillStyle = T.pit; ctx.fillRect(TX, TY, 5 * CELL, 5 * CELL);
  // 台座（頂上）
  ctx.fillStyle = T.dark; ctx.beginPath(); ctx.moveTo(204, TY - 5); ctx.lineTo(276, TY - 5); ctx.lineTo(268, TY - 21); ctx.lineTo(212, TY - 21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = T.wood; ctx.fillRect(208, TY - 26, 64, 6);
  starPath(240, TY - 44, 16, 6.5); ctx.strokeStyle = 'rgba(255,209,102,.6)'; ctx.lineWidth = 2; ctx.stroke();
  // マス
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const x = cx(c), y = cy(r);
    if (r === STAR.r && c === STAR.c) { drawPit(x, y); continue; }
    const b = blocks.find(b => b.r === r && b.c0 === c);
    if (b) { if (b.pulled) drawPit(x, y); else drawDrawer(x, y, true); continue; }
    const f = hardFx[r + ',' + c];
    const dx = (f != null && !mq.matches && clock - f < 0.3) ? Math.sin((clock - f) * 70) * 3 * (1 - (clock - f) / 0.3) : 0;
    drawHard(x + dx, y);
  }
  // 星
  const sx = cx(STAR.c) + 28, sy = cy(STAR.r) + 28;
  drawStar(sx, sy, 18);
  if (state === 'clear') {
    const p = mq.matches ? 1 : clamp((clock - (clearAt - 0.5)) / 0.7, 0, 1);
    ctx.strokeStyle = 'rgba(255,209,102,' + (1 - p * 0.7) + ')'; ctx.lineWidth = 4 - p * 2;
    ctx.beginPath(); ctx.arc(sx, sy, 24 + p * 110, 0, Math.PI * 2); ctx.stroke();
  }
  blocks.forEach(b => { if (b.pulled) drawScaffold(b); });
  if (ground) drawGround(GY);
  const p = pocoXY(); drawPoco(p.x, p.y, dir);
  // 「かたい！」
  for (const k in hardFx) {
    const t = clock - hardFx[k];
    if (t < 0 || t > 0.9) continue;
    const [r, c] = k.split(',').map(Number), bx = cx(c) + 28, by = cy(r) - 6;
    ctx.globalAlpha = t > 0.6 ? 1 - (t - 0.6) / 0.3 : 1;
    rr(bx - 34, by - 26, 68, 24, 8); ctx.fillStyle = T.cream; ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 5, by - 3); ctx.lineTo(bx + 5, by - 3); ctx.lineTo(bx, by + 5); ctx.closePath(); ctx.fill();
    text('かたい！', bx, by - 9, 14, '#5A3A1A', 'center');
    ctx.globalAlpha = 1;
  }
}

/* ---------- 描画: HUD・画面 ---------- */
function banner(s, y, color) {
  const size = fitSize(s, 400, 15), w = ctx.measureText(s).width + 28;
  rr(240 - w / 2, y - 22, w, 34, 17); ctx.fillStyle = 'rgba(10,14,32,.88)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
  text(s, 240, y, size, T.text, 'center');
}
function drawHUD() {
  text('のこり', 16, 30, 14, T.text);
  for (let i = 0; i < MAX_PULLS; i++) {
    const x = 66 + i * 32, y = 14, on = i < pulls;
    rr(x, y, 26, 20, 4);
    if (on) { ctx.fillStyle = T.cream; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = T.dark; ctx.stroke(); ctx.fillStyle = T.dark; ctx.beginPath(); ctx.arc(x + 13, y + 13, 4.5, Math.PI, 0); ctx.closePath(); ctx.fill(); }
    else { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(244,227,193,.3)'; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]); }
  }
  const t = state === 'play' ? gameT : timeSec;
  text('じかん', 190, 30, 14, 'rgba(244,241,255,.75)');
  text(t.toFixed(1) + ' びょう', 244, 31, 17, T.text);
  text('いどう', 16, 62, 14, 'rgba(244,241,255,.75)');
  text(moves + ' かい', 66, 63, 17, T.text);
}
function drawTitle() {
  text('ヒキダシタワー', 240, 92, 46, T.gold, 'center', 800);
  text('〜ブロックを引いてのぼれ〜', 240, 128, 19, T.teal, 'center');
  const s = 0.62;
  ctx.save(); ctx.translate(240 * (1 - s), 176 - (TY - 54) * s); ctx.scale(s, s);
  drawScene(false); ctx.restore();
  const gy = 176 + (GY - (TY - 54)) * s;
  drawGround(gy);
  const ls = ['光るブロックをタップして、横に引き出そう', 'ポコは上へ1段・横へ1列までジャンプできるよ', '引けるのは3回まで。足場を作って星をめざそう'];
  ls.forEach((l, i) => text(l, 240, gy + 50 + i * 30, fitSize(l, 440, 16), T.text, 'center', 600));
}
function drawClear() {
  if (clock < clearAt) return;
  ctx.fillStyle = 'rgba(27,35,64,.8)'; ctx.fillRect(0, 0, W, H);
  rr(50, 170, 380, 330, 18); ctx.fillStyle = '#242E55'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = T.gold; ctx.stroke();
  text('クリア！', 240, 232, 44, T.gold, 'center', 800);
  [['タイム', timeSec.toFixed(1) + ' びょう'], ['いどう', moves + ' かい'], ['引いた数', pullsUsed + ' かい']].forEach(([a, b], i) => {
    text(a, 80, 300 + i * 44, 17, 'rgba(244,241,255,.75)');
    text(b, 262, 300 + i * 44, 21, T.text, 'right');
  });
  text('ランク', 352, 292, 14, 'rgba(244,241,255,.75)', 'center');
  ctx.beginPath(); ctx.arc(352, 346, 44, 0, Math.PI * 2); ctx.lineWidth = 4; ctx.strokeStyle = T.gold; ctx.stroke();
  text(rank, 352, 366, 56, T.gold, 'center', 800);
  text('Sは40秒以内・移動6回以内、Aは60秒以内', 240, 460, fitSize('Sは40秒以内・移動6回以内、Aは60秒以内', 340, 13), 'rgba(244,241,255,.65)', 'center', 600);
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  drawScene(true);
  drawHUD();
  if (stuck) banner(MSG_STUCK, 104, T.coral);
  else if (clock < toastUntil && toastText) banner(toastText, 104, T.teal);
  if (state === 'clear') drawClear();
}

/* ---------- ループ・入力 ---------- */
let shownAgain = null, shownStart = null, shownEmph = null, shownReset = null;
function syncDom() {
  const a = state === 'clear' && clock >= clearAt, s = state === 'title', e = stuck;
  if (a !== shownAgain) { btnAgain.hidden = !a; shownAgain = a; if (a && !DEMO) btnAgain.focus({ preventScroll: true }); }
  if (s !== shownStart) { btnStart.hidden = !s; shownStart = s; }
  const rv = state !== 'title';
  if (rv !== shownReset) { btnReset.hidden = !rv; shownReset = rv; }
  if (e !== shownEmph) { btnReset.classList.toggle('emph', e); shownEmph = e; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  clock += dt;
  if (state === 'play') { gameT += dt; runDemo(); }
  syncDom(); draw();
  requestAnimationFrame(frame);
}
function resize() {
  const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  S = cv.width / W;
}
new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect();
  const h = hit((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  if (h) onCell(h.r, h.c);
});
function primary() { initAudio(); if (state === 'play') return; startGame(); }
btnStart.addEventListener('click', primary);
btnAgain.addEventListener('click', primary);
btnReset.addEventListener('click', () => { initAudio(); resetGame(); });
window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (state === 'clear' && clock < clearAt) return;
  if (e.code === 'Space' || e.key === 'Enter') {
    if (state !== 'play') { e.preventDefault(); primary(); }
  } else if (e.code === 'KeyR') {
    resetGame();
  } else if (/^[1-5]$/.test(e.key) && state === 'play') {
    initAudio();
    const i = +e.key - 1, p = PULLABLE[i];
    // 未引きなのに足場に覆われているマスは、移動せず「かたい！」にする（タップの挙動は変えない）
    if (!blocks[i].pulled && blocks.some(b => b.pulled && b.r === p.r && b.c0 - 1 === p.c)) {
      hardFx[p.r + ',' + p.c] = clock; sfxClick();
    } else onCell(p.r, p.c);
  }
});

/* ---------- 起動 ---------- */
window.__hikidashi = {
  get state() { return state; },
  get stats() { return { moves, pulls, pullsUsed, timeSec: state === 'play' ? gameT : timeSec, rank }; }
};
resetBoard();
resize();
if (DEMO) { startGame(); toastText = ''; demoQ = buildDemoTaps(); }
else btnStart.focus({ preventScroll: true });
requestAnimationFrame(frame);
})();
</script>
</body>
