<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドリフトチャージ 〜ためて、はなて！〜</title>
<style>
  :root {
    --bg: #1E2A4A;
    --grass: #2E7D4F;
    --grass-dark: #256B43;
    --road: #3A3F4B;
    --line: #F5F1E6;
    --charge-blue: #3EC6FF;
    --charge-orange: #FF9F1C;
    --danger: #FF4D4D;
    --car: #FF6B5E;
    --text: #F5F1E6;
    --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  header h1 small { font-size: 13px; opacity: 0.75; margin-left: 0.4em; }
  .stage {
    position: relative;
    width: min(96vw, 480px, calc((100vh - 110px) * 0.75));
    width: min(96vw, 480px, calc((100dvh - 110px) * 0.75));
    aspect-ratio: 3 / 4;
    container-type: size;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    background: var(--grass);
  }
  .stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .overlay-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 13%;
    font-family: var(--font);
    font-size: 4cqw;
    font-weight: 700;
    white-space: nowrap;
    padding: 0.65em 1.9em;
    border: none;
    border-radius: 999px;
    background: var(--car);
    color: var(--text);
    box-shadow: 0 0.4em 0 #C9473D, 0 0.8em 1.4em rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }
  .overlay-btn:active { transform: translateX(-50%) translateY(0.25em); box-shadow: 0 0.15em 0 #C9473D; }
  .overlay-btn:focus-visible { outline: 3px solid var(--charge-blue); outline-offset: 4px; }
  .overlay-btn[hidden] { display: none; }
  .reset-btn {
    position: absolute;
    top: 1.4cqw;
    right: 1.6cqw;
    font-family: var(--font);
    font-size: 3cqw;
    font-weight: 700;
    white-space: nowrap;
    padding: 0.35em 0.95em;
    border-radius: 999px;
    border: 1px solid rgba(245, 241, 230, 0.45);
    background: rgba(30, 42, 74, 0.7);
    color: var(--text);
    cursor: pointer;
  }
  .reset-btn:focus-visible { outline: 2px solid var(--charge-blue); outline-offset: 2px; }
  footer {
    font-size: 12px;
    opacity: 0.7;
    text-align: center;
    line-height: 1.5;
    padding: 0 12px;
  }
</style>
</head>
<body>
<header><h1>ドリフトチャージ<small>〜ためて、はなて！〜</small></h1></header>
<div class="stage" id="stage">
  <canvas id="game" width="480" height="640" aria-label="ドリフトチャージのゲーム画面"></canvas>
  <button class="overlay-btn" id="startBtn" type="button">スタート</button>
  <button class="overlay-btn" id="retryBtn" type="button" hidden>もう一度</button>
  <button class="reset-btn" id="resetBtn" type="button">リセット</button>
</div>
<footer>スペース長押し／ゲーム画面長押しでドリフト ・ R でリセット</footer>

<script>
(() => {
  'use strict';

  // ---------- tokens ----------
  const C = {
    bg: '#1E2A4A', grass: '#2E7D4F', grassDark: '#256B43', road: '#3A3F4B',
    line: '#F5F1E6', blue: '#3EC6FF', orange: '#FF9F1C', red: '#FF4D4D',
    car: '#FF6B5E', text: '#F5F1E6',
  };
  const FONT = '"Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Arial Rounded MT Bold", system-ui, sans-serif';
  const W = 480, H = 640;

  // ---------- rules ----------
  const BASE_SPEED = 110;      // px/s along centerline
  const CHARGE_TIME = 1.2;     // 0 -> 1
  const ZONE_BLUE = 0.45, ZONE_ORANGE = 0.85;
  const BLUE_BOOST = { mult: 1.5, dur: 0.9 };
  const ORANGE_BOOST = { mult: 2.2, dur: 1.2 };
  const SPIN_TIME = 1.2;
  const STEP = 1 / 120;        // fixed simulation step
  const ROAD_W = 46;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isDemo = new URLSearchParams(location.search).has('demo');

  // ---------- course (lines + 180° arcs, tangent-continuous) ----------
  const SEGS = [];
  let TOTAL = 0;
  function addLine(x0, y0, x1, y1) {
    const len = Math.hypot(x1 - x0, y1 - y0);
    SEGS.push({ type: 'line', x0, y0, dx: (x1 - x0) / len, dy: (y1 - y0) / len, len, s0: TOTAL });
    TOTAL += len;
  }
  function addArc(cx, cy, r, dir) { // starts at top of circle (angle -PI/2)
    const len = Math.PI * r;
    SEGS.push({ type: 'arc', cx, cy, r, a0: -Math.PI / 2, dir, len, s0: TOTAL });
    TOTAL += len;
  }
  const R = 75;
  addLine(280, 80, 120, 80);
  addArc(120, 155, R, -1);       // curve 1: upper, left turn
  addLine(120, 230, 360, 230);
  addArc(360, 305, R, 1);        // curve 2: middle, right turn
  addLine(360, 380, 120, 380);
  addArc(120, 455, R, -1);       // curve 3: lower, left turn
  addLine(120, 530, 280, 530);

  const CURVES = SEGS.filter(s => s.type === 'arc').map((s, i) => ({
    idx: i, start: s.s0, end: s.s0 + s.len, dir: s.dir, seg: s,
  }));

  function pointAt(s) {
    s = Math.max(0, Math.min(TOTAL, s));
    let seg = SEGS[SEGS.length - 1];
    for (const g of SEGS) { if (s <= g.s0 + g.len) { seg = g; break; } }
    const l = s - seg.s0;
    if (seg.type === 'line') {
      return { x: seg.x0 + seg.dx * l, y: seg.y0 + seg.dy * l, a: Math.atan2(seg.dy, seg.dx) };
    }
    const th = seg.a0 + seg.dir * (l / seg.r);
    return { x: seg.cx + seg.r * Math.cos(th), y: seg.cy + seg.r * Math.sin(th), a: th + seg.dir * Math.PI / 2 };
  }
  function curveAt(s) {
    for (const c of CURVES) if (s >= c.start && s < c.end) return c.idx;
    return -1;
  }
  function tracePath(ctx, s0, s1) {
    const p = pointAt(s0);
    ctx.moveTo(p.x, p.y);
    for (let s = s0 + 3; s < s1; s += 3) { const q = pointAt(s); ctx.lineTo(q.x, q.y); }
    const e = pointAt(s1); ctx.lineTo(e.x, e.y);
  }

  // ---------- canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * DPR; canvas.height = H * DPR;

  const courseLayer = document.createElement('canvas');
  courseLayer.width = W * DPR; courseLayer.height = H * DPR;
  (function buildCourse() {
    const g = courseLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (let y = 0, i = 0; y < H; y += 32, i++) {
      g.fillStyle = i % 2 ? C.grassDark : C.grass;
      g.fillRect(0, y, W, 32);
    }
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); tracePath(g, 0, TOTAL);
    g.strokeStyle = '#23272F'; g.lineWidth = ROAD_W + 6; g.stroke();
    for (const c of CURVES) {
      g.lineCap = 'butt';
      g.beginPath(); tracePath(g, c.start, c.end);
      g.strokeStyle = C.line; g.lineWidth = ROAD_W + 12; g.stroke();
      g.setLineDash([10, 10]);
      g.beginPath(); tracePath(g, c.start, c.end);
      g.strokeStyle = C.red; g.stroke();
      g.setLineDash([]);
    }
    g.lineCap = 'round';
    g.beginPath(); tracePath(g, 0, TOTAL);
    g.strokeStyle = C.road; g.lineWidth = ROAD_W; g.stroke();
    g.setLineDash([12, 14]);
    g.beginPath(); tracePath(g, 10, TOTAL - 10);
    g.strokeStyle = 'rgba(245,241,230,0.75)'; g.lineWidth = 2.5; g.stroke();
    g.setLineDash([]);
    function checker(s) {
      const p = pointAt(s);
      g.save(); g.translate(p.x, p.y); g.rotate(p.a);
      const sz = ROAD_W / 8;
      for (let i = 0; i < 8; i++) for (let j = 0; j < 2; j++) {
        g.fillStyle = (i + j) % 2 ? '#1b1d22' : C.line;
        g.fillRect(-sz + j * sz, -ROAD_W / 2 + i * sz, sz, sz);
      }
      g.restore();
    }
    checker(8); checker(TOTAL - 8);
    g.fillStyle = C.text; g.font = `700 13px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('スタート', 312, 81);
    g.fillText('ゴール', 312, 531);
    for (const c of CURVES) {
      for (const s of [c.start, c.end]) {
        const p = pointAt(s);
        g.save(); g.translate(p.x, p.y); g.rotate(p.a);
        g.strokeStyle = 'rgba(245,241,230,0.55)'; g.lineWidth = 2; g.setLineDash([5, 4]);
        g.beginPath(); g.moveTo(0, -ROAD_W / 2 + 3); g.lineTo(0, ROAD_W / 2 - 3); g.stroke();
        g.restore();
      }
    }
  })();

  // ---------- state ----------
  let state = 'title';
  const car = { s: 0, v: 0, boostT: 0, boostMult: 1, spinT: 0 };
  let steps = 0, gameTime = 0, acc = 0;
  let records = [null, null, null];
  let drifting = false, driftCurve = -1, charge = 0, overWarned = false;
  let inCurve = -1;
  let flash = null;
  let zoomT = 0, spinAngle = 0, clearTime = 0, rank = null;
  let sparks = [];
  let demoPlan = null, demoIdx = 0;

  function resetRun() {
    car.s = 0; car.v = 0; car.boostT = 0; car.boostMult = 1; car.spinT = 0;
    steps = 0; gameTime = 0; acc = 0;
    records = [null, null, null];
    drifting = false; driftCurve = -1; charge = 0; overWarned = false;
    inCurve = -1; flash = null; zoomT = 0; spinAngle = 0; clearTime = 0; rank = null;
    sparks = [];
    demoPlan = null; demoIdx = 0;
    stopDriftSound();
  }

  // kinematics shared by the game and the demo planner
  function advance(o, dt) {
    let v;
    if (o.spinT > 0) { v = 0; o.spinT = Math.max(0, o.spinT - dt); }
    else {
      v = BASE_SPEED * (o.boostT > 0 ? o.boostMult : 1);
      if (o.boostT > 0) { o.boostT = Math.max(0, o.boostT - dt); if (o.boostT === 0) o.boostMult = 1; }
    }
    o.s += v * dt; o.v = v;
  }

  // demo plan: simulate beforehand, find each curve entry, press 0.15 s after, release 0.70 s later
  function planDemo() {
    const sim = { s: 0, v: 0, boostT: 0, boostMult: 1, spinT: 0 };
    const plan = [];
    const PRESS_DELAY = 18, HOLD = 84; // steps -> charge ≈ 0.58 (orange)
    let n = 0, ci = 0, releaseStep = -1;
    while (sim.s < TOTAL && n < 20000) {
      n++;
      if (n === releaseStep) { sim.boostT = ORANGE_BOOST.dur; sim.boostMult = ORANGE_BOOST.mult; releaseStep = -1; }
      advance(sim, STEP);
      if (ci < CURVES.length && sim.s >= CURVES[ci].start) {
        const p = n + PRESS_DELAY;
        plan.push({ step: p, type: 'press' }, { step: p + HOLD, type: 'release' });
        releaseStep = p + HOLD;
        ci++;
      }
    }
    return plan;
  }

  function showFlash(text, color, dur) { flash = { text, color, t: 0, dur }; }

  function startGame(demo) {
    resetRun();
    state = 'play';
    if (demo) { demoPlan = planDemo(); demoIdx = 0; }
    startBtn.hidden = true; retryBtn.hidden = true;
  }
  function resetToTitle() {
    resetRun();
    state = 'title';
    startBtn.hidden = false; retryBtn.hidden = true;
  }

  // ---------- input actions (shared by player and demo) ----------
  function pressDrift() {
    if (state !== 'play' || drifting) return;
    if (car.spinT > 0) return;
    const ci = curveAt(car.s);
    if (ci < 0) { showFlash('カーブに入ってから長押ししよう', C.text, 1.2); return; }
    if (records[ci] !== null) { showFlash(ci === CURVES.length - 1 ? 'このカーブは使用ずみだよ' : 'このカーブは使用ずみ。次のカーブで長押ししよう', C.text, 1.4); return; }
    drifting = true; driftCurve = ci; charge = 0; overWarned = false;
    startDriftSound();
  }
  function releaseDrift() {
    if (state !== 'play' || !drifting) return;
    drifting = false;
    stopDriftSound();
    let result;
    if (charge < ZONE_BLUE) {
      result = 'blue';
      car.boostT = BLUE_BOOST.dur; car.boostMult = BLUE_BOOST.mult;
      zoomT = 0.3; showFlash('小ブースト！', C.blue, 0.9); sfxSmallBoost();
    } else if (charge < ZONE_ORANGE) {
      result = 'orange';
      car.boostT = ORANGE_BOOST.dur; car.boostMult = ORANGE_BOOST.mult;
      zoomT = 0.3; showFlash('ビッグブースト！', C.orange, 1.0); sfxBigBoost();
    } else {
      result = 'spin';
      car.boostT = 0; car.boostMult = 1; car.spinT = SPIN_TIME;
      showFlash('ためすぎた！赤になる前に離そう', C.red, 2.0); sfxSpin();
    }
    records[driftCurve] = result;
    charge = 0;
  }

  function finish() {
    car.s = TOTAL;
    if (drifting) releaseDrift();
    state = 'clear';
    clearTime = Math.round(gameTime * 10) / 10;
    const s = stats();
    rank = (s.orangeBoosts === 3 && clearTime <= 10.5) ? 'S'
      : (s.orangeBoosts >= 2 || (s.orangeBoosts >= 1 && clearTime <= 12.5)) ? 'A' : 'B';
    retryBtn.hidden = false;
    sfxFanfare();
  }

  // ---------- simulation step ----------
  function step(dt) {
    steps++;
    gameTime = steps * STEP;
    if (demoPlan) {
      while (demoIdx < demoPlan.length && steps >= demoPlan[demoIdx].step) {
        const a = demoPlan[demoIdx++];
        if (a.type === 'press') pressDrift(); else releaseDrift();
      }
    }
    if (drifting) {
      charge = Math.min(1, charge + dt / CHARGE_TIME);
      if (charge >= 0.75 && !overWarned) { overWarned = true; showFlash('ためすぎ注意！', C.red, 0.9); sfxWarn(); }
      updateDriftSound();
      if (!reduceMotion) spawnSparks(dt);
    }
    advance(car, dt);
    spinAngle = car.spinT > 0 && !reduceMotion ? (1 - car.spinT / SPIN_TIME) * Math.PI * 2 : 0;
    const ci = curveAt(car.s);
    if (ci !== inCurve) {
      if (drifting && driftCurve === inCurve) releaseDrift();
      inCurve = ci;
      // カーブ手前から押しっぱなしの場合、入った瞬間にドリフト開始
      if (ci >= 0 && held && !drifting) pressDrift();
    }
    if (car.s >= TOTAL) finish();
  }

  // ---------- sparks ----------
  function zoneColor(c) { return c < ZONE_BLUE ? C.blue : c < ZONE_ORANGE ? C.orange : C.red; }
  function carPose() {
    const p = pointAt(car.s);
    let body = p.a;
    if (drifting) body += CURVES[driftCurve].dir * 0.42;
    body += spinAngle;
    return { x: p.x, y: p.y, a: p.a, body };
  }
  let sparkAcc = 0;
  function spawnSparks(dt) {
    sparkAcc += dt * 90;
    const pose = carPose();
    const col = zoneColor(charge);
    const cos = Math.cos(pose.body), sin = Math.sin(pose.body);
    while (sparkAcc >= 1) {
      sparkAcc -= 1;
      const side = Math.random() < 0.5 ? -1 : 1;
      const lx = -11, ly = side * 11;
      const x = pose.x + lx * cos - ly * sin, y = pose.y + lx * sin + ly * cos;
      const back = pose.body + Math.PI + (Math.random() - 0.5) * 1.1;
      const sp = 60 + Math.random() * 90;
      sparks.push({ x, y, vx: Math.cos(back) * sp, vy: Math.sin(back) * sp, life: 0, max: 0.22 + Math.random() * 0.2, col });
    }
    if (sparks.length > 160) sparks.splice(0, sparks.length - 160);
  }
  function updateSparks(dt) {
    for (const p of sparks) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
    sparks = sparks.filter(p => p.life < p.max);
  }

  // ---------- audio (WebAudio synthesis only) ----------
  let actx = null, master = null, noiseBuf = null, drift = null;
  function initAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(type, f0, f1, dur, vol, when = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function pluck(freq, when, dur = 0.35, vol = 0.22) { tone('triangle', freq, freq, dur, vol, when); }
  function startDriftSound() {
    if (!actx || drift) return;
    const t = actx.currentTime;
    const n = actx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.9;
    const ng = actx.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.07, t + 0.05);
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = 180;
    const og = actx.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
    n.connect(bp); bp.connect(ng); ng.connect(master);
    o.connect(og); og.connect(master);
    n.start(t); o.start(t);
    drift = { n, o, ng, og, bp };
  }
  function updateDriftSound() {
    if (!actx || !drift) return;
    const t = actx.currentTime;
    drift.o.frequency.setTargetAtTime(180 + charge * 480, t, 0.03);
    drift.bp.frequency.setTargetAtTime(1400 + charge * 1600, t, 0.05);
  }
  function stopDriftSound() {
    if (!actx || !drift) return;
    const t = actx.currentTime;
    const d = drift; drift = null;
    d.ng.gain.cancelScheduledValues(t); d.og.gain.cancelScheduledValues(t);
    d.ng.gain.setTargetAtTime(0.0001, t, 0.02); d.og.gain.setTargetAtTime(0.0001, t, 0.02);
    d.n.stop(t + 0.12); d.o.stop(t + 0.12);
  }
  function sfxSmallBoost() { tone('sine', 400, 800, 0.2, 0.3); }
  function sfxBigBoost() {
    tone('sine', 400, 1200, 0.35, 0.32);
    [1568, 2093, 2637].forEach((f, i) => pluck(f, 0.06 + i * 0.06, 0.18, 0.12));
  }
  function sfxSpin() {
    tone('sine', 600, 150, 0.5, 0.3);
    for (let i = 0; i < 3; i++) tone('square', 110, 110, 0.06, 0.12, 0.08 + i * 0.09);
  }
  function sfxWarn() { tone('square', 880, 880, 0.07, 0.08); tone('square', 880, 880, 0.07, 0.08, 0.11); }
  function sfxFanfare() {
    [523, 659, 784, 1047].forEach((f, i) => pluck(f, i * 0.12, i === 3 ? 0.8 : 0.35, 0.24));
  }

  // ---------- drawing ----------
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function drawCar(g, x, y, angle, scale = 1) {
    g.save();
    g.translate(x, y); g.rotate(angle); g.scale(scale, scale);
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.beginPath(); g.ellipse(2, 3, 18, 16, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1b1d22';
    for (const [wx, wy] of [[-9, -13], [-9, 13], [9, -13], [9, 13]]) {
      roundRect(g, wx - 5, wy - 3.5, 10, 7, 3); g.fill();
    }
    g.fillStyle = C.car;
    g.beginPath(); g.arc(0, 0, 15, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.arc(-3, -5, 9, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.line;
    g.beginPath(); g.arc(7, 0, 5.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(62,198,255,0.35)';
    g.beginPath(); g.arc(8, -1.5, 2.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.orange;
    g.beginPath(); g.arc(-3.5, 0, 6.5, 0, Math.PI * 2); g.fill();
    g.strokeStyle = C.line; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-10, 0); g.lineTo(3, 0); g.stroke();
    g.fillStyle = C.bg;
    g.beginPath(); g.arc(1.5, 0, 2.6, -Math.PI / 2, Math.PI / 2); g.fill();
    g.restore();
  }

  function drawSign(c, mode) { // 'next' | 'done' | 'later'
    const seg = c.seg;
    const sx = seg.cx + (c.dir < 0 ? 30 : -30), sy = seg.cy;
    ctx.save();
    ctx.globalAlpha = mode === 'done' ? 0.35 : mode === 'later' ? 0.7 : 1;
    ctx.fillStyle = mode === 'next' ? C.orange : 'rgba(30,42,74,0.75)';
    roundRect(ctx, sx - 30, sy - 26, 60, 52, 12); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const ax = sx + (c.dir < 0 ? 4 : -4), ay = sy - 6, r = 9;
    ctx.beginPath();
    ctx.arc(ax, ay, r, -Math.PI / 2, Math.PI / 2, c.dir < 0);
    ctx.stroke();
    const hx = ax, hy = ay + r, hd = c.dir < 0 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(hx + hd * 5, hy); ctx.lineTo(hx - hd * 1, hy - 5); ctx.moveTo(hx + hd * 5, hy); ctx.lineTo(hx - hd * 1, hy + 5);
    ctx.stroke();
    ctx.fillStyle = C.line; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('カーブ' + (c.idx + 1), sx, sy + 16);
    ctx.restore();
  }

  function drawEntryChevrons(c, bright) {
    const col = bright ? C.orange : 'rgba(245,241,230,0.45)';
    for (const off of [10, 24]) {
      const p = pointAt(c.start + off);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-4, -9); ctx.lineTo(4, 0); ctx.lineTo(-4, 9); ctx.stroke();
      ctx.restore();
    }
  }

  function nextCurveIndex() {
    for (const c of CURVES) if (car.s < c.end && records[c.idx] === null) return c.idx;
    return -1;
  }

  function drawWorld(pose) {
    ctx.drawImage(courseLayer, 0, 0, W, H);
    const nx = nextCurveIndex();
    for (const c of CURVES) {
      const st = records[c.idx] !== null || car.s >= c.end ? 'done' : c.idx === nx ? 'next' : 'later';
      drawSign(c, st);
      drawEntryChevrons(c, st === 'next');
    }
    if (car.boostT > 0 && state === 'play') {
      const col = car.boostMult > 2 ? C.orange : C.blue;
      ctx.save();
      ctx.translate(pose.x, pose.y); ctx.rotate(pose.a);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-30 - Math.random() * 8, 0); ctx.lineTo(-14, 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(245,241,230,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (const yy of [-18, -9, 9, 18]) {
        const len = 26 + (yy * 7 % 13 + 13) % 13;
        ctx.beginPath(); ctx.moveTo(-22, yy); ctx.lineTo(-22 - len, yy); ctx.stroke();
      }
      ctx.restore();
    }
    if (sparks.length) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      for (const p of sparks) {
        const k = 1 - p.life / p.max;
        ctx.strokeStyle = p.col; ctx.globalAlpha = k; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
      }
      ctx.restore();
    }
    if (drifting && reduceMotion) {
      ctx.save(); ctx.translate(pose.x, pose.y); ctx.rotate(pose.body);
      ctx.fillStyle = zoneColor(charge); ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(-11, -11, 5, 0, Math.PI * 2); ctx.arc(-11, 11, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawCar(ctx, pose.x, pose.y, pose.body);
  }

  function drawZoomLines(pose) {
    if (zoomT <= 0 || reduceMotion) return;
    const k = zoomT / 0.3;
    ctx.save();
    ctx.strokeStyle = C.line; ctx.lineCap = 'round';
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2 + (i % 2) * 0.08;
      const r0 = 70 + (i * 37) % 50, r1 = r0 + 90 + (i * 53) % 80;
      ctx.globalAlpha = 0.5 * k; ctx.lineWidth = 2 + (i % 3);
      ctx.beginPath();
      ctx.moveTo(pose.x + Math.cos(a) * r0, pose.y + Math.sin(a) * r0);
      ctx.lineTo(pose.x + Math.cos(a) * r1, pose.y + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(30,42,74,0.78)';
    ctx.fillRect(0, 0, W, 42);
    ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const ts = (state === 'clear' ? clearTime : gameTime).toFixed(1);
    ctx.font = `700 20px ${FONT}`;
    ctx.fillText(ts, 16, 22);
    const tw = ctx.measureText(ts).width;
    ctx.font = `700 12px ${FONT}`;
    ctx.fillText('秒', 16 + tw + 4, 24);
    ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'right'; ctx.globalAlpha = 0.75;
    ctx.fillText('カーブ', 196, 22); ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      const x = 216 + i * 28, y = 21, r = 9, rec = records[i];
      if (rec === 'orange' || rec === 'blue') {
        ctx.fillStyle = rec === 'orange' ? C.orange : C.blue;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      } else if (rec === 'spin') {
        ctx.strokeStyle = C.red; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(245,241,230,0.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r - 1, 0, Math.PI * 2); ctx.stroke();
      }
    }

    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 566, W, H - 566);
    const gx = 40, gw = 400, gy = 598, gh = 20;
    ctx.save();
    ctx.globalAlpha = drifting ? 1 : 0.45;
    const zones = [[0, ZONE_BLUE, C.blue, '小ブースト'], [ZONE_BLUE, ZONE_ORANGE, C.orange, 'ビッグブースト'], [ZONE_ORANGE, 1, C.red, 'ためすぎ']];
    ctx.save();
    roundRect(ctx, gx, gy, gw, gh, 10); ctx.clip();
    for (const [a, b, col] of zones) { ctx.fillStyle = col; ctx.fillRect(gx + a * gw, gy, (b - a) * gw, gh); }
    ctx.fillStyle = 'rgba(30,42,74,0.55)';
    ctx.fillRect(gx + charge * gw, gy, gw - charge * gw, gh);
    ctx.restore();
    ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (const [a, b, col, label] of zones) { ctx.fillStyle = col; ctx.fillText(label, gx + (a + b) / 2 * gw, gy - 7); }
    ctx.restore();
    const mx = gx + charge * gw;
    ctx.fillStyle = C.line;
    ctx.fillRect(mx - 1.5, gy - 3, 3, gh + 6);
    ctx.beginPath(); ctx.moveTo(mx, gy + gh + 3); ctx.lineTo(mx - 6, gy + gh + 11); ctx.lineTo(mx + 6, gy + gh + 11); ctx.closePath(); ctx.fill();
  }

  function contextMessage() {
    if (state !== 'play') return null;
    if (flash) return flash;
    if (drifting) return charge >= ZONE_ORANGE ? { text: 'ためすぎ！', color: C.red } : null;
    const ci = curveAt(car.s);
    if (ci >= 0 && records[ci] === null && car.spinT <= 0) return { text: 'カーブ！ホールドでドリフト', color: C.text };
    return null;
  }

  function drawMessage(pose) {
    const m = contextMessage();
    if (!m) return;
    ctx.save();
    ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(m.text).width + 26, h = 30;
    const x = Math.max(w / 2 + 8, Math.min(W - w / 2 - 8, pose.x));
    let y = pose.y - 42;
    if (y < 60) y = pose.y + 42;
    ctx.fillStyle = 'rgba(30,42,74,0.9)';
    roundRect(ctx, x - w / 2, y - h / 2, w, h, 15); ctx.fill();
    ctx.strokeStyle = m.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, x, y + 1);
    ctx.restore();
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(30,42,74,0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 44px ${FONT}`;
    ctx.fillText('ドリフトチャージ', W / 2, 108);
    ctx.font = `700 20px ${FONT}`; ctx.fillStyle = C.orange;
    ctx.fillText('〜ためて、はなて！〜', W / 2, 152);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(W / 2 + 70, 300, 90, Math.PI * 0.95, Math.PI * 1.55);
    ctx.strokeStyle = C.line; ctx.lineWidth = 50; ctx.stroke();
    ctx.setLineDash([10, 10]); ctx.strokeStyle = C.red; ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = C.road; ctx.lineWidth = 40; ctx.stroke();
    ctx.restore();
    const ix = W / 2 + 70 + Math.cos(Math.PI * 1.2) * 90, iy = 300 + Math.sin(Math.PI * 1.2) * 90;
    const ia = Math.PI * 1.2 + Math.PI / 2;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 7; i++) {
      const side = i % 2 ? 1 : -1, back = ia + 0.42 + Math.PI + (i - 3) * 0.16;
      const bx = ix + Math.cos(ia + 0.42 + Math.PI) * 13 + Math.cos(ia + 0.42 + Math.PI / 2) * side * 10;
      const by = iy + Math.sin(ia + 0.42 + Math.PI) * 13 + Math.sin(ia + 0.42 + Math.PI / 2) * side * 10;
      ctx.strokeStyle = i < 3 ? C.blue : C.orange;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(back) * (14 + i * 2), by + Math.sin(back) * (14 + i * 2)); ctx.stroke();
    }
    ctx.restore();
    drawCar(ctx, ix, iy, ia + 0.42, 1.8);
    ctx.fillStyle = C.text; ctx.font = `700 13px ${FONT}`;
    ctx.fillText('ルルとコロリン号', W / 2 - 80, 352);

    const lines = [
      'カーブに入ったら長押しでドリフト',
      'ゲージが青→橙とたまる。赤はためすぎ',
      '離した瞬間にブースト！橙ならビッグブースト',
    ];
    lines.forEach((s, i) => {
      const y = 404 + i * 32;
      ctx.fillStyle = [C.blue, C.orange, C.car][i];
      ctx.beginPath(); ctx.arc(70, y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.bg; ctx.textAlign = 'center'; ctx.font = `700 13px ${FONT}`;
      ctx.fillText(String(i + 1), 70, y + 1);
      ctx.fillStyle = C.text; ctx.textAlign = 'left'; ctx.font = `700 15px ${FONT}`;
      ctx.fillText(s, 92, y + 1);
    });
  }

  function drawClear() {
    ctx.fillStyle = 'rgba(30,42,74,0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.text; ctx.font = `700 54px ${FONT}`;
    ctx.fillText('クリア！', W / 2, 130);
    const rc = rank === 'S' ? C.orange : rank === 'A' ? C.blue : C.line;
    ctx.strokeStyle = rc; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W / 2, 250, 58, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = rc; ctx.font = `700 70px ${FONT}`;
    ctx.fillText(rank || '', W / 2, 256);
    ctx.fillStyle = C.text; ctx.font = `700 13px ${FONT}`;
    ctx.fillText('ランク', W / 2, 330);
    ctx.font = `700 26px ${FONT}`;
    ctx.fillText(`タイム ${clearTime.toFixed(1)} 秒`, W / 2, 378);
    const s = stats();
    const parts = [[`橙×${s.orangeBoosts}`, C.orange], [' / ', C.text], [`青×${s.blueBoosts}`, C.blue], [' / ', C.text], [`スピン×${s.spins}`, C.red]];
    ctx.font = `700 20px ${FONT}`;
    const total = parts.reduce((w, [t]) => w + ctx.measureText(t).width, 0);
    let x = W / 2 - total / 2;
    ctx.textAlign = 'left';
    for (const [t, col] of parts) { ctx.fillStyle = col; ctx.fillText(t, x, 420); x += ctx.measureText(t).width; }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const pose = carPose();
    ctx.save();
    if (zoomT > 0 && !reduceMotion) {
      const p = 1 - zoomT / 0.3;
      const sc = 1 + 0.06 * Math.sin(Math.PI * p);
      const sh = 3 * (1 - p);
      ctx.translate((Math.random() - 0.5) * 2 * sh, (Math.random() - 0.5) * 2 * sh);
      ctx.translate(pose.x, pose.y); ctx.scale(sc, sc); ctx.translate(-pose.x, -pose.y);
    }
    drawWorld(pose);
    drawZoomLines(pose);
    ctx.restore();
    drawHUD();
    if (state === 'play') drawMessage(pose);
    if (state === 'title') drawTitle();
    if (state === 'clear') drawClear();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (state === 'play') {
      acc += dt;
      while (acc >= STEP && state === 'play') { step(STEP); acc -= STEP; }
    }
    if (flash) { flash.t += dt; if (flash.t >= flash.dur) flash = null; }
    if (zoomT > 0) zoomT = Math.max(0, zoomT - dt);
    updateSparks(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------- stats / debug hook ----------
  function stats() {
    const orangeBoosts = records.filter(r => r === 'orange').length;
    const blueBoosts = records.filter(r => r === 'blue').length;
    const spins = records.filter(r => r === 'spin').length;
    return {
      boosts: orangeBoosts + blueBoosts, orangeBoosts, blueBoosts, spins,
      timeSec: Math.round((state === 'clear' ? clearTime : gameTime) * 10) / 10,
      rank: state === 'clear' ? rank : null,
    };
  }
  window.__driftcharge = {
    get state() { return state; },
    get stats() { return stats(); },
  };

  // ---------- wiring ----------
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const resetBtn = document.getElementById('resetBtn');
  startBtn.addEventListener('click', () => { initAudio(); startGame(false); });
  retryBtn.addEventListener('click', () => { initAudio(); startGame(false); });
  resetBtn.addEventListener('click', () => { initAudio(); resetToTitle(); resetBtn.blur(); });

  let spaceDown = false;
  let held = false; // スペース／画面の長押し中（カーブ突入時の自動ドリフト開始用）
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (e.repeat || spaceDown) return;
      spaceDown = true;
      held = true;
      initAudio();
      if (state === 'play') pressDrift(); else startGame(false);
    } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (e.repeat) return;
      initAudio();
      if (state !== 'play') startGame(false);
    } else if (e.code === 'KeyR') {
      if (e.repeat) return;
      resetToTitle();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      spaceDown = false;
      held = false;
      releaseDrift();
    }
  });
  window.addEventListener('blur', () => { spaceDown = false; held = false; releaseDrift(); });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    if (state !== 'play') return;
    held = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    pressDrift();
  });
  const up = () => { held = false; releaseDrift(); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  if (isDemo) startGame(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
