<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふっとばしバトル 〜%をためて場外へ〜</title>
<link rel="icon" href="data:,">
<style>
:root{
  --sora:#9ED8F5;   /* 空 */
  --kusa:#86C98A;   /* 草 */
  --hi:#FFD35A;     /* 陽 */
  --pon:#3F7FE0;    /* ポン */
  --pon-ink:#1F5BB8; /* ポン（文字用・濃色） */
  --moku:#E85A43;   /* モク */
  --moku-ink:#C03922; /* モク（文字用・濃色） */
  --sumi:#233249;   /* 墨 */
  --f-round:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Kosugi Maru","Arial Rounded MT Bold","Yu Gothic UI",system-ui,sans-serif;
  --f-body:system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --f-num:"DIN Condensed","Bahnschrift","Arial Narrow","Roboto Condensed",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#BFE6F8}
body{display:grid;place-items:center;overflow:hidden;font-family:var(--f-body);color:var(--sumi);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:min(100vw,calc(100vh * 0.6),480px);width:min(100vw,calc(100dvh * 0.6),480px);aspect-ratio:480/800;overflow:hidden;
  container-type:inline-size;background:linear-gradient(180deg,var(--sora) 0%,#CBEBFA 58%,#F2FAFE 100%);outline:none}
#app *{--u:calc(100cqw / 480)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none}
button:focus-visible{outline:3px solid var(--sumi);outline-offset:3px;box-shadow:0 0 0 7px #fff}

/* HUD */
#hud .row{position:absolute;top:calc(var(--u)*14);left:calc(var(--u)*14);right:calc(var(--u)*14);
  display:flex;align-items:center;gap:calc(var(--u)*10)}
.pill{background:rgba(255,255,255,.72);border-radius:999px;height:max(36px,calc(var(--u)*46));
  display:flex;align-items:center;padding:0 calc(var(--u)*16);font-weight:700}
#time{font-family:var(--f-num);font-size:calc(var(--u)*30);font-variant-numeric:tabular-nums;min-width:calc(var(--u)*86);justify-content:center}
#time.hurry{color:var(--moku)}
#stars{font-size:calc(var(--u)*24);letter-spacing:.06em}
#stars .on{color:var(--hi);-webkit-text-stroke:1.5px var(--sumi);paint-order:stroke fill}
#stars .off{color:rgba(35,50,73,.22)}
#lives{font-size:calc(var(--u)*22);color:var(--pon);gap:calc(var(--u)*4)}
#lives .off{color:rgba(35,50,73,.2)}
#lives small{font-family:var(--f-num);font-size:calc(var(--u)*20);color:var(--sumi);margin-left:calc(var(--u)*6);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.round-btn{width:max(44px,calc(var(--u)*46));height:max(44px,calc(var(--u)*46));border-radius:50%;
  background:rgba(255,255,255,.72);display:grid;place-items:center}
.round-btn svg{width:55%;height:55%}
#pctBox{position:absolute;top:calc(var(--u)*84);left:0;right:0;text-align:center;pointer-events:none;line-height:.9}
#pctBox .who{font-family:var(--f-round);font-weight:700;font-size:calc(var(--u)*16);color:var(--moku-ink);
  background:#fff;border-radius:999px;padding:.2em .9em;display:inline-block;margin-bottom:calc(var(--u)*4)}
#pct{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:calc(var(--u) * var(--s,72));color:#fff;-webkit-text-stroke:calc(var(--u)*5) var(--sumi);paint-order:stroke fill;letter-spacing:-.02em}
#pct small{font-size:.45em}
#pct.mid{color:var(--hi)} #pct.high{color:var(--moku)}
#badge{position:absolute;top:calc(var(--u)*14 + max(44px,calc(var(--u)*46)) + var(--u)*8);right:calc(var(--u)*14);background:var(--sumi);color:#fff;
  border-radius:999px;padding:.35em 1em;font-size:calc(var(--u)*14);font-weight:700;pointer-events:none}
#gauge{position:absolute;top:calc(var(--u)*616);left:50%;transform:translateX(-50%);width:calc(var(--u)*230);
  height:max(18px,calc(var(--u)*22));border-radius:999px;background:rgba(255,255,255,.8);overflow:hidden;pointer-events:none;text-align:center}
#gauge i{position:absolute;inset:0;width:calc(var(--g,0) * 100%);background:var(--pon);border-radius:999px}
#gauge.full i{background:var(--hi)}
#gauge.wait{opacity:.45}
#gauge span{position:relative;display:inline-block;padding:0 .6em;background:rgba(255,255,255,.95);border-radius:999px;text-align:center;font-size:calc(var(--u)*13);line-height:max(18px,calc(var(--u)*22));font-weight:700;color:var(--sumi)}

/* 操作ボタン */
#pad{position:absolute;left:0;right:0;bottom:calc(var(--u)*46);display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*14)}
#pad button{height:max(56px,calc(var(--u)*80));border-radius:999px;background:#fff;
  font-family:var(--f-round);font-weight:700;box-shadow:0 calc(var(--u)*5) 0 rgba(35,50,73,.18)}
#pad .dir{width:max(56px,calc(var(--u)*80));font-size:calc(var(--u)*28)}
#atk{width:max(120px,calc(var(--u)*178));font-size:calc(var(--u)*26);background:var(--pon)!important;color:#fff}
#pad button.down{transform:translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*1) 0 rgba(35,50,73,.18)}
footer{position:absolute;left:0;right:0;bottom:calc(var(--u)*12);text-align:center;font-size:calc(var(--u)*13);
  color:rgba(35,50,73,.78);pointer-events:none}

/* タイトル・リザルト */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.screen>*{pointer-events:auto}
#title h1{font-family:var(--f-round);font-weight:800;margin:calc(var(--u)*118) 0 0;font-size:calc(var(--u)*56);line-height:1.05;
  color:#fff;-webkit-text-stroke:calc(var(--u)*7) var(--sumi);paint-order:stroke fill}
#title .sub{margin:calc(var(--u)*12) 0 0;font-family:var(--f-round);font-weight:700;font-size:calc(var(--u)*20)}
#title ol{list-style:none;margin:calc(var(--u)*44) 0 0;padding:0;font-size:calc(var(--u)*17);line-height:1.9}
#title ol b{font-family:var(--f-round);color:var(--pon-ink)}
.go{position:absolute;top:calc(var(--u)*606);left:50%;transform:translateX(-50%);min-height:max(56px,calc(var(--u)*76));
  padding:0 calc(var(--u)*48);border-radius:999px;background:var(--sumi);color:#fff;font-family:var(--f-round);
  font-weight:800;font-size:calc(var(--u)*28);box-shadow:0 calc(var(--u)*6) 0 rgba(35,50,73,.25)}
#result h2{font-family:var(--f-round);font-weight:800;font-size:calc(var(--u)*34);margin:calc(var(--u)*92) 0 0}
#rank{margin-top:calc(var(--u)*18);width:calc(var(--u)*190);height:calc(var(--u)*190);border-radius:50%;background:var(--hi);
  box-shadow:0 0 0 calc(var(--u)*18) rgba(255,211,90,.35);display:grid;place-items:center;
  font-family:var(--f-num);font-weight:800;font-size:calc(var(--u)*140);line-height:1;color:var(--sumi)}
#result dl{margin:calc(var(--u)*40) 0 0;display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*6) calc(var(--u)*26);
  font-size:calc(var(--u)*19);text-align:left}
#result dt{font-weight:700;color:rgba(35,50,73,.7)}
#result dd{margin:0;font-family:var(--f-num);font-size:1.35em;font-variant-numeric:tabular-nums;text-align:right}

/* ドーン！ */
#boom{position:absolute;top:calc(var(--u)*300);width:calc(var(--u)*200);height:calc(var(--u)*130);margin-left:calc(var(--u)*-100);
  display:grid;place-items:center;pointer-events:none;opacity:0}
#boom::before{content:"";position:absolute;inset:0;background:#fff;border-radius:50%;
  box-shadow:calc(var(--u)*-60) calc(var(--u)*18) 0 calc(var(--u)*-22) #fff,calc(var(--u)*62) calc(var(--u)*22) 0 calc(var(--u)*-26) #fff,0 0 0 calc(var(--u)*5) var(--sumi)}
#boom b{position:relative;font-family:var(--f-round);font-weight:800;font-size:calc(var(--u)*48);color:var(--moku);
  -webkit-text-stroke:calc(var(--u)*2) var(--sumi);paint-order:stroke fill}
#boom.show{animation:boom .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes boom{0%{opacity:0;transform:scale(.2) rotate(-8deg)}18%{opacity:1;transform:scale(1.12) rotate(3deg)}
  32%{transform:scale(1) rotate(0)}78%{opacity:1}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #boom.show{animation:boomRM .9s steps(1) forwards}
  @keyframes boomRM{0%{opacity:1}100%{opacity:0}}
  #pad button.down{transform:none}
}
</style>
</head>
<body>
<div id="app" tabindex="-1" aria-label="ふっとばしバトル">
  <canvas id="cv" width="480" height="800" aria-hidden="true"></canvas>

  <div id="hud" class="layer hidden" aria-live="off">
    <div class="row">
      <div class="pill" id="time">1:00</div>
      <div class="pill" id="stars" aria-label="KO数"></div>
      <div class="spacer"></div>
      <div class="pill" id="lives" aria-label="ライフ"></div>
      <button class="round-btn" id="mute" aria-label="音を消す" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="#233249" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="#233249"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path id="cross" d="M17 9l5 6M22 9l-5 6" style="display:none"/>
        </svg>
      </button>
    </div>
    <div id="pctBox"><span class="who">モク</span><div id="pct">0<small>%</small></div></div>
    <div id="badge" class="hidden">デモプレイ中</div>
    <div id="gauge" aria-hidden="true"><i></i><span>ため</span></div>
    <div id="pad">
      <button class="dir" id="bl" aria-label="左へ移動">◀</button>
      <button class="dir" id="br" aria-label="右へ移動">▶</button>
      <button id="atk" aria-label="こうげき（長押しで、ため攻撃）">こうげき</button>
    </div>
  </div>

  <div id="boom" aria-hidden="true"><b>ドーン！</b></div>
  <div id="liveMsg" class="sr-only" aria-live="polite"></div>

  <section id="title" class="screen">
    <h1>ふっとばし<br>バトル</h1>
    <p class="sub">〜%をためて場外へ〜</p>
    <ol>
      <li><b>◀ ▶</b>（← → / A D）でポンを動かす</li>
      <li><b>こうげき</b>（Space / Z）でモクの％をためる</li>
      <li>長押しして離すと <b>ため攻撃</b>。60秒で3回ふっとばせば勝ち</li>
    </ol>
    <button class="go" id="start">はじめる</button>
  </section>

  <section id="result" class="screen hidden" role="dialog" aria-modal="true" aria-labelledby="resHead">
    <h2 id="resHead">かち！</h2>
    <div id="rank">S</div>
    <dl>
      <dt>KO数</dt><dd id="rKo">3</dd>
      <dt>タイム</dt><dd id="rTime">0.0秒</dd>
      <dt>スコア</dt><dd id="rScore">0</dd>
    </dl>
    <button class="go" id="again">もう一度</button>
  </section>

  <footer>Day 10 ・ 100日リメイク</footer>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 800, CX = 240, GROUND = 560, EDGE = 210, R = 28, STEP = 1 / 120;
const DEMO = new URLSearchParams(location.search).has('demo');
const mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let RM = !!(mq && mq.matches);
if (mq && mq.addEventListener) mq.addEventListener('change', e => { RM = e.matches; });

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

/* ---------- 状態 ---------- */
let S, P, M;
const input = { left: false, right: false };
const events = [];
window.__demoEvents = events;
const pub = {};
window.__futtobashi = pub;
let demoAcc = 0;

function reset() {
  S = { state: 'title', t: 0, kos: 0, lives: 3, winAt: null, loseAt: null, end: null, lastTick: 99, shake: 0 };
  P = { x: -120, kb: 0, pct: 0, face: 1, cd: 0, chargeCd: 0, holding: false, holdT: 0, inv: 0, fall: null, swing: 0, hurt: 0 };
  M = { x: 120, kb: 0, pct: 0, face: -1, atkT: 0, atkGap: 1.4, stun: 0, sinceHit: 9, fly: null, swing: 0, hurt: 0 };
  input.left = input.right = false;
  demoAcc = 0;
}
reset();

function log(type, extra) {
  const e = Object.assign({ t: r2(S.t), type }, extra || {});
  events.push(e);
  return e;
}

/* ---------- 音（WebAudio 合成） ---------- */
let AC = null, master = null, muted = false, unlocked = false, chargeOsc = null;
function ac() {
  if (!unlocked) return null;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
    } catch (e) { AC = null; return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function unlock() { unlocked = true; ac(); }
function tone(f0, f1, dur, type, vol, delay) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}
function whoosh(dur, f0, f1, vol) {
  const a = ac(); if (!a) return;
  const t = a.currentTime, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 2.5;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
}
const sfx = {
  pon: big => { tone(big ? 380 : 620, big ? 140 : 260, big ? 0.22 : 0.12, 'sine', 0.45); if (big) tone(90, 50, 0.25, 'triangle', 0.4); },
  whiff: () => tone(300, 200, 0.06, 'sine', 0.08),
  bonk: () => tone(240, 120, 0.14, 'triangle', 0.3),
  chargeStart: () => {
    const a = ac(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.08);
    o.connect(g); g.connect(master); o.start(t);
    chargeOsc = { o, g };
  },
  chargeStop: () => {
    if (!chargeOsc || !AC) { chargeOsc = null; return; }
    const t = AC.currentTime;
    chargeOsc.g.gain.cancelScheduledValues(t);
    chargeOsc.g.gain.setValueAtTime(Math.max(0.0001, chargeOsc.g.gain.value), t);
    chargeOsc.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    chargeOsc.o.stop(t + 0.07); chargeOsc = null;
  },
  ko: () => { whoosh(0.45, 600, 3200, 0.5); [1046, 1568, 2093].forEach((f, i) => tone(f, 0, 0.5, 'sine', 0.22, 0.18 + i * 0.09)); },
  fall: () => { tone(150, 55, 0.32, 'square', 0.18); },
  tick: () => tone(1500, 0, 0.035, 'square', 0.08),
  fanfare: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0, i === 3 ? 0.6 : 0.16, 'triangle', 0.3, i * 0.14)); },
  lose: () => { [392, 330, 262].forEach((f, i) => tone(f, 0, 0.3, 'triangle', 0.25, i * 0.22)); }
};

/* ---------- ゲームの進行 ---------- */
function startGame() {
  if (DEMO) { /* デモではジェスチャーなしで AudioContext を作らない（効果音ノードの蓄積防止） */ }
  else unlock();
  reset();
  events.length = 0;
  $('liveMsg').textContent = '';
  puffs.length = 0;
  clearTimeout(boomTimer);
  $('boom').classList.remove('show');
  S.state = 'playing';
  $('title').classList.add('hidden');
  $('result').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('badge').classList.toggle('hidden', !DEMO);
  $('app').focus({ preventScroll: true });
  log('game_start', { demo: DEMO });
}

function pressAttack() {
  if (S.state !== 'playing' && S.state !== 'ko') return;
  if (P.holding || P.fall) return;
  P.holding = true; P.holdT = 0;
  if (P.chargeCd <= 0) sfx.chargeStart();
}
function releaseAttack(cancel) {
  if (!P.holding) return;
  P.holding = false;
  sfx.chargeStop();
  if (cancel) return;
  doAttack(P.holdT >= 0.6 - 1e-6 && P.chargeCd <= 0);
}
function doAttack(charged) {
  if (P.fall || (S.state !== 'playing' && S.state !== 'ko')) return;
  if (!charged && P.cd > 0) return;
  P.cd = 0.4; P.swing = 0.16;
  if (charged) P.chargeCd = 1.0;
  const dx = M.x - P.x;
  if (M.fly || Math.abs(dx) >= 70) { sfx.whiff(); return; }
  const dmg = charged ? 25 : (DEMO ? 10 : randInt(8, 14));
  M.pct += dmg;
  let kb = 24 + M.pct * 1.4;
  if (charged) kb *= 2.2;
  const dir = Math.sign(dx) || P.face;
  M.kb += dir * kb; M.stun = charged ? 0.5 : 0.25; M.sinceHit = 0; M.hurt = 0.3;
  P.face = dir;
  addPuff(M.x - dir * 16, GROUND - R, charged);
  sfx.pon(charged);
  log(charged ? 'charged_hit' : 'hit', { dmg, rivalPct: M.pct, knockback: r2(kb) });
}
function rivalAttack() {
  M.swing = 0.2;
  if (P.fall || P.inv > 0) return;
  P.pct += 8;
  const kb = 18 + P.pct * 1.0;
  const dir = Math.sign(P.x - M.x) || -M.face;
  P.kb += dir * kb; P.hurt = 0.3;
  addPuff(P.x - dir * 16, GROUND - R, false);
  sfx.bonk();
}
function rivalKO() {
  S.kos++;
  const dir = Math.sign(M.x) || 1;
  M.fly = { t: 0, x: M.x, y: 0, vx: dir * 430, vy: -780, rot: 0, dir };
  M.kb = 0;
  if (S.kos >= 3 && S.loseAt === null) S.winAt = S.t;
  S.state = 'ko';
  S.shake = 0.45;
  log('ko', { kos: S.kos, rivalPct: M.pct });
  sfx.ko();
  showBoom(dir);
}
function respawnRival() {
  if (S.state === 'result') return;
  M.fly = null; M.x = 0; M.pct = 0; M.kb = 0; M.atkT = 0; M.stun = 0.3; M.sinceHit = 9;
  if (S.winAt !== null) { endGame(true, S.winAt); return; }
  S.state = 'playing';
}
function playerFall() {
  S.lives--;
  P.fall = { t: 0, x: P.x, y: 0, vx: Math.sign(P.x) * 160, vy: -260 };
  P.kb = 0;
  releaseAttack(true);
  if (S.lives <= 0) S.loseAt = S.t;
  log('player_fall', { lives: S.lives, playerPct: P.pct });
  sfx.fall();
}
function respawnPlayer() {
  if (S.winAt !== null) return;
  if (S.loseAt !== null) { endGame(false, S.loseAt); return; }
  P.fall = null; P.x = 0; P.pct = 0; P.kb = 0; P.inv = 1.2;
}
function endGame(win, at) {
  if (S.state === 'result') return;
  releaseAttack(true);
  input.left = input.right = false;
  S.state = 'result';
  const elapsed = Math.round(Math.min(60, at) * 10) / 10;
  const rank = win ? (elapsed <= 25 ? 'S' : elapsed <= 40 ? 'A' : 'B') : 'C';
  const score = S.kos * 1000 + (win ? Math.round(Math.max(0, 60 - elapsed) * 20) : 0);
  S.end = { win, elapsedSec: elapsed, rank, score, kos: S.kos, lives: S.lives, rivalPct: M.pct, playerPct: P.pct };
  log('result', { stats: Object.assign({}, S.end) });
  $('resHead').textContent = win ? 'かち！' : (S.lives <= 0 ? 'ライフがなくなった' : '時間切れ');
  $('liveMsg').textContent = (win ? 'かち！ランク' : 'まけ。ランク') + rank + '、KO' + S.kos + '、タイム' + elapsed.toFixed(1) + '秒、スコア' + score;
  $('rank').textContent = rank;
  $('rKo').textContent = S.kos;
  $('rTime').textContent = elapsed.toFixed(1) + '秒';
  $('rScore').textContent = score.toLocaleString('ja-JP');
  $('hud').classList.add('hidden');
  $('result').classList.remove('hidden');
  if (win) sfx.fanfare(); else sfx.lose();
  $('again').focus({ preventScroll: true });
}

function applyKb(o, dt) {
  if (!o.kb) return;
  let d = o.kb * (1 - Math.exp(-9 * dt));
  if (Math.abs(o.kb) < 0.5) d = o.kb;
  o.x += d; o.kb -= d;
}

/* ---------- デモの自動操作（100msごと） ---------- */
function demoTick(dt) {
  demoAcc += dt;
  if (demoAcc < 0.1 - 1e-9) return;
  demoAcc -= 0.1;
  if (P.holding) {
    input.left = input.right = false;
    if (P.holdT >= 0.7 - 1e-6) releaseAttack(false);
    return;
  }
  if (P.fall) { input.left = input.right = false; return; }
  if (M.fly) { const d = -P.x; input.right = d > 8; input.left = d < -8; return; }
  const dx = M.x - P.x;
  if (Math.abs(dx) >= 60) { input.right = dx > 0; input.left = dx < 0; return; }
  input.left = input.right = false;
  if (M.pct >= 30 && P.chargeCd <= 0) { pressAttack(); return; }
  if (P.cd <= 0) { pressAttack(); releaseAttack(false); }
}

/* ---------- 1ステップ（固定 1/120 秒） ---------- */
function step(dt) {
  if (S.state !== 'playing' && S.state !== 'ko') return;
  S.t += dt;
  const left = 60 - S.t;
  if (S.winAt === null && left <= 10 && left > 0 && Math.ceil(left) < S.lastTick) { S.lastTick = Math.ceil(left); sfx.tick(); }
  if (S.t >= 60 && S.winAt === null && S.loseAt === null) { endGame(false, 60); return; }
  if (DEMO) demoTick(dt);

  // ポン
  const wasCd = P.chargeCd;
  P.cd = Math.max(0, P.cd - dt); P.chargeCd = Math.max(0, P.chargeCd - dt);
  if (wasCd > 0 && P.chargeCd === 0 && P.holding && S.state === 'playing') sfx.chargeStart();
  P.inv = Math.max(0, P.inv - dt); P.swing = Math.max(0, P.swing - dt); P.hurt = Math.max(0, P.hurt - dt);
  if (P.fall && S.winAt === null) {
    const f = P.fall; f.t += dt; f.vy += 1400 * dt; f.y += f.vy * dt; f.x += f.vx * dt;
    if (f.t >= 0.8) respawnPlayer();
    if (S.state === 'result') return;
  } else if (S.winAt === null) {
    const mv = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (mv > 0) P.x = Math.min(P.x + 180 * dt, Math.max(P.x, 200));
    if (mv < 0) P.x = Math.max(P.x - 180 * dt, Math.min(P.x, -200));
    if (mv && !P.holding) P.face = mv;
    if (P.holding) P.holdT += dt;
    applyKb(P, dt);
    if (Math.abs(P.x) > EDGE) playerFall();
  }

  // モク
  M.swing = Math.max(0, M.swing - dt); M.hurt = Math.max(0, M.hurt - dt);
  if (M.fly) {
    const f = M.fly; f.t += dt; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt;
    if (!RM) f.rot += f.dir * 15 * dt;
    if (f.t >= 0.8) respawnRival();
  } else {
    M.stun = Math.max(0, M.stun - dt); M.sinceHit += dt;
    applyKb(M, dt);
    if (Math.abs(M.x) > EDGE) rivalKO();
    else if (M.stun <= 0) {
      const dx = P.x - M.x, adx = Math.abs(dx);
      if (!P.fall) {
        if (dx) M.face = Math.sign(dx);
        if (adx > 56) M.x += Math.sign(dx) * 60 * dt;
        else if (M.sinceHit > 0.6 && Math.abs(M.x) > 0.5) M.x -= Math.sign(M.x) * Math.min(25 * dt, Math.abs(M.x));
        if (adx < 70) {
          M.atkT += dt;
          if (M.atkT >= M.atkGap) { M.atkT = 0; M.atkGap = DEMO ? 1.4 : rand(1.1, 1.7); rivalAttack(); }
        }
      } else if (Math.abs(M.x) > 0.5) {
        M.x -= Math.sign(M.x) * Math.min(25 * dt, Math.abs(M.x));
      }
    }
  }

  // 重なり防止（動くのはモク側）
  if (!P.fall && !M.fly) {
    const d = M.x - P.x;
    if (Math.abs(d) < 44) {
      const s = Math.sign(d) || (P.x > 0 ? -1 : 1);
      M.x = clamp(P.x + s * 44, -EDGE + 4, EDGE - 4);
    }
  }
}

/* ---------- 演出 ---------- */
const puffs = [];
function addPuff(x, y, big) { puffs.push({ x, y, t: 0, big }); }
let boomTimer = 0;
function showBoom(dir) {
  const el = $('boom');
  el.style.left = ((CX + dir * 120) / W * 100) + '%';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(boomTimer);
  boomTimer = setTimeout(() => el.classList.remove('show'), 950);
}

const clouds = [
  { x: 60, y: 250, s: 1.0, v: 6 }, { x: 330, y: 300, s: 0.7, v: 4 },
  { x: 200, y: 420, s: 0.55, v: 8 }, { x: 420, y: 470, s: 0.9, v: 5 }
];
function cloud(x, y, s, a) {
  ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
  ctx.beginPath();
  [[0, 0, 26], [28, -10, 32], [60, 0, 24], [30, 8, 26]].forEach(c => {
    ctx.moveTo(x + c[0] * s + c[2] * s, y + c[1] * s);
    ctx.arc(x + c[0] * s, y + c[1] * s, c[2] * s, 0, Math.PI * 2);
  });
  ctx.fill();
}
function drawSky(dt) {
  ctx.fillStyle = 'rgba(255,211,90,.25)';
  ctx.beginPath(); ctx.arc(392, 230, 64, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFD35A';
  ctx.beginPath(); ctx.arc(392, 230, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(134,201,138,.45)';
  [[80, 380, 0.5], [410, 400, 0.35]].forEach(([x, y, s]) => {
    ctx.beginPath(); ctx.ellipse(x, y, 60 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y + 6 * s, 46 * s, 34 * s, 0, 0, Math.PI); ctx.fill();
  });
  clouds.forEach(c => {
    if (!RM) { c.x += c.v * dt; if (c.x > W + 40) c.x = -120; }
    cloud(c.x, c.y, c.s, 0.85);
  });
}
function drawIsland() {
  const L = CX - EDGE, Rr = CX + EDGE;
  ctx.fillStyle = '#6FAE77';
  ctx.beginPath();
  ctx.moveTo(L - 6, GROUND + 8);
  ctx.bezierCurveTo(L + 30, GROUND + 120, CX - 60, GROUND + 150, CX, GROUND + 150);
  ctx.bezierCurveTo(CX + 60, GROUND + 150, Rr - 30, GROUND + 120, Rr + 6, GROUND + 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(35,50,73,.12)';
  [[CX - 70, GROUND + 70, 14], [CX + 40, GROUND + 100, 10], [CX + 120, GROUND + 50, 8]].forEach(([x, y, r]) => {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#86C98A';
  ctx.beginPath();
  ctx.moveTo(L + 12, GROUND); ctx.lineTo(Rr - 12, GROUND);
  ctx.arc(Rr - 12, GROUND + 12, 12, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(L + 12, GROUND + 24);
  ctx.arc(L + 12, GROUND + 12, 12, Math.PI / 2, Math.PI * 1.5);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(L + 14, GROUND + 2, Rr - L - 28, 4);
}
function drawCloudSea() {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const x = i * 62 - 10, y = 770 + (i % 2) * 18, r = 54 + (i % 3) * 10;
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  ctx.fill();
}
function shadow(x, scale) {
  ctx.fillStyle = 'rgba(35,50,73,.2)';
  ctx.beginPath(); ctx.ellipse(x, GROUND + 3, R * 1.05 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
}
function blob(x, y, color, face, o) {
  ctx.save();
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  const s = o.scale || 1, sq = o.sq || 0;
  ctx.scale(s * (1 + sq), s * (1 - sq));
  if (o.ring) {
    ctx.strokeStyle = o.ringFull ? '#FFD35A' : 'rgba(255,255,255,.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, R + 6 + o.ring * 8, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-9, -11, 9, 0, Math.PI * 2); ctx.fill();
  const ex = face * 7;
  ctx.strokeStyle = ctx.fillStyle = '#233249';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  if (o.hurt) {
    [-1, 1].forEach(k => {
      const cx = ex + k * 9;
      ctx.beginPath(); ctx.moveTo(cx - 4 * k, -10); ctx.lineTo(cx + 3 * k, -6); ctx.lineTo(cx - 4 * k, -2); ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(ex, 9, 4, 0, Math.PI * 2); ctx.fill();
  } else {
    [-1, 1].forEach(k => { ctx.beginPath(); ctx.ellipse(ex + k * 9, -6, 3.2, 5, 0, 0, Math.PI * 2); ctx.fill(); });
    ctx.beginPath(); ctx.arc(ex, 6, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}
function drawFighters() {
  if (P.fall) {
    const f = P.fall;
    blob(CX + f.x, GROUND - R + f.y, '#3F7FE0', P.face, { hurt: true, alpha: Math.max(0, 1 - f.t / 0.8) });
  } else {
    shadow(CX + P.x, 1);
    const lean = P.swing > 0 ? P.face * 6 : 0;
    const g = P.holding ? Math.min(1, P.holdT / 0.6) : 0;
    blob(CX + P.x + lean, GROUND - R + g * 3, '#3F7FE0', P.face, {
      hurt: P.hurt > 0, alpha: P.inv > 0 ? 0.55 : 1, sq: P.holding ? g * 0.12 : (P.swing > 0 ? -0.06 : 0),
      ring: P.holding && P.chargeCd <= 0 ? g : 0, ringFull: g >= 1
    });
  }
  if (M.fly) {
    const f = M.fly;
    blob(CX + f.x, GROUND - R + f.y, '#E85A43', -f.dir, { hurt: true, rot: f.rot, scale: Math.max(0.45, 1 - f.t * 0.6) });
  } else {
    shadow(CX + M.x, 1);
    const wind = !P.fall && Math.abs(P.x - M.x) < 70 && M.atkGap - M.atkT < 0.25 && M.stun <= 0 && S.state !== 'title';
    const lean = M.swing > 0 ? M.face * 7 : (wind ? -M.face * 4 : 0);
    blob(CX + M.x + lean, GROUND - R, '#E85A43', M.face, { hurt: M.hurt > 0, sq: wind ? 0.08 : 0 });
  }
}
function drawPuffs(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    const k = p.t / 0.25; if (k >= 1) { puffs.splice(i, 1); continue; }
    ctx.fillStyle = 'rgba(255,255,255,' + (1 - k) + ')';
    const n = p.big ? 7 : 5, rad = (p.big ? 34 : 20) * (0.4 + k);
    for (let j = 0; j < n; j++) {
      const a = j / n * Math.PI * 2;
      ctx.beginPath(); ctx.arc(CX + p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad, (p.big ? 9 : 6) * (1 - k * 0.5), 0, Math.PI * 2); ctx.fill();
    }
  }
}
function draw(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (S.shake > 0) {
    S.shake = Math.max(0, S.shake - dt);
    if (!RM) { const k = S.shake / 0.45; ctx.translate((Math.random() - 0.5) * 20 * k, (Math.random() - 0.5) * 12 * k); }
  }
  drawSky(dt);
  drawIsland();
  drawFighters();
  drawPuffs(dt);
  drawCloudSea();
}

/* ---------- HUD ---------- */
const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).innerHTML = v; } }
function hud() {
  if (S.state !== 'playing' && S.state !== 'ko') return;
  const left = Math.max(0, 60 - S.t), sec = Math.ceil(left);
  setText('time', Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
  $('time').classList.toggle('hurry', left <= 10);
  let st = ''; for (let i = 0; i < 3; i++) st += '<span class="' + (i < S.kos ? 'on' : 'off') + '">★</span>';
  setText('stars', st);
  let lv = ''; for (let i = 0; i < 3; i++) lv += '<span class="' + (i < S.lives ? '' : 'off') + '">♥</span>';
  setText('lives', lv + '<small>' + P.pct + '%</small>');
  const pct = M.pct, el = $('pct');
  setText('pct', pct + '<small>%</small>');
  el.className = pct >= 80 ? 'high' : pct >= 40 ? 'mid' : '';
  el.style.setProperty('--s', String(72 + Math.min(pct, 120) * 0.4));
  const g = $('gauge');
  const fill = P.holding ? Math.min(1, P.holdT / 0.6) : 0;
  g.style.setProperty('--g', String(fill));
  g.classList.toggle('full', fill >= 1);
  g.classList.toggle('wait', P.chargeCd > 0);
}
function publish() {
  const done = S.state === 'result' && S.end;
  pub.state = S.state;
  pub.kos = S.kos;
  pub.rivalPct = M.pct;
  pub.playerPct = P.pct;
  pub.lives = S.lives;
  pub.timeMs = Math.round(Math.max(0, 60 - (done ? S.end.elapsedSec : S.t)) * 1000); // 残り時間(ms)
  pub.elapsedSec = done ? S.end.elapsedSec : r2(S.t);
  pub.rank = done ? S.end.rank : null;
  pub.score = done ? S.end.score : S.kos * 1000;
  pub.events = events;
  pub.demo = DEMO;
}

/* ---------- 入力 ---------- */
const playing = () => S.state === 'playing' || S.state === 'ko';
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' && e.target && e.target.id === 'mute') return;
  if (!playing() || DEMO) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; e.preventDefault(); }
  else if (k === ' ' || k === 'z' || k === 'Z') { e.preventDefault(); if (!e.repeat) pressAttack(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  else if (k === ' ' || k === 'z' || k === 'Z') {
    const onMute = e.target && e.target.id === 'mute';
    if (playing() && !onMute) e.preventDefault();
    if (!DEMO) releaseAttack(false);
  }
});
window.addEventListener('blur', () => { if (!DEMO) { input.left = input.right = false; releaseAttack(true); } });

function holdButton(el, down, up) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); unlock();
    if (DEMO || !playing()) return;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add('down'); down();
  });
  const end = cancel => e => {
    if (!el.classList.contains('down')) return;
    el.classList.remove('down'); up(cancel);
    if (e && e.pointerType === 'mouse') $('app').focus({ preventScroll: true });
  };
  el.addEventListener('pointerup', end(false));
  el.addEventListener('pointercancel', end(true));
  el.addEventListener('lostpointercapture', end(false));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdButton($('bl'), () => { input.left = true; }, () => { input.left = false; });
holdButton($('br'), () => { input.right = true; }, () => { input.right = false; });
[['bl', 'left'], ['br', 'right']].forEach(([id, key]) => {
  const el = $(id);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); e.stopPropagation();
      if (DEMO || !playing()) return;
      el.classList.add('down'); input[key] = true;
    }
  });
  el.addEventListener('keyup', e => {
    if (e.key === 'Enter' || e.key === ' ') { el.classList.remove('down'); input[key] = false; }
  });
  el.addEventListener('blur', () => { el.classList.remove('down'); input[key] = false; });
});
holdButton($('atk'), pressAttack, cancel => releaseAttack(cancel));
$('atk').addEventListener('click', e => { if (e.detail === 0 && !DEMO && playing()) doAttack(false); });

$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('mute').addEventListener('click', e => {
  unlock();
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.5;
  $('mute').setAttribute('aria-pressed', String(muted));
  $('mute').setAttribute('aria-label', muted ? '音を出す' : '音を消す');
  $('waves').style.display = muted ? 'none' : '';
  $('cross').style.display = muted ? '' : 'none';
  if (e.detail > 0) $('app').focus({ preventScroll: true });
});
window.addEventListener('pointerdown', unlock, { once: true });
window.addEventListener('keydown', unlock, { once: true });

/* ---------- ループ ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now; acc += dt;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  draw(dt);
  hud();
  publish();
  requestAnimationFrame(frame);
}
publish();
if (DEMO) startGame();
requestAnimationFrame(frame);
})();
</script>
